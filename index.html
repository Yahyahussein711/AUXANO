function adjustEx(sid, idx, field, delta){
  const e = editCtx().exercises[sid][idx];
  const step = e.isTime ? 5 : 1;
  if(field==='sets'){
    e.sets = clamp(e.sets + delta, 1, 10);
  } else if(field==='repMin'){
    e.repMin = clamp(e.repMin + delta, step, e.repMax);
  } else if(field==='repMax'){
    e.repMax = clamp(e.repMax + delta, e.repMin, e.isTime ? 300 : 50);
  } else if(field==='inc'){
    // inc moves along the unit's plate-increment list, so delta is a list offset
    let i = weightSteps().indexOf(e.inc);
    if(i === -1){
      i = weightSteps().reduce((best,w,wi)=>
        Math.abs(w-e.inc) < Math.abs(weightSteps()[best]-e.inc) ? wi : best, 0);
    }
    e.inc = weightSteps()[clamp(i + delta, 0, weightSteps().length-1)];
  }
}

// Repaint a single row in place — a full renderWizard() here would throw away scroll position.
function repaintPlanRow(key){
  const el = root.querySelector(`.planrow[data-row="${key}"]`);
  if(!el) return null;
  const [sid, idxStr] = key.split('|');
  const idx = parseInt(idxStr, 10);
  el.outerHTML = planRowHTML(sid, idx, editCtx().exercises[sid][idx]);
  return bindPlanRow(key);
}

function bindPlanRow(key){
  const el = root.querySelector(`.planrow[data-row="${key}"]`);
  if(!el) return null;
  el.querySelector('[data-exrow]')?.addEventListener('click', ()=>{
    const prev = editCtx().openEx;
    editCtx().openEx = (prev === key) ? null : key;
    if(prev && prev !== key) repaintPlanRow(prev);
    const fresh = repaintPlanRow(key);
    if(editCtx().openEx && fresh){
      const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
      fresh.scrollIntoView?.({block:'nearest', behavior: calm ? 'auto' : 'smooth'});
    }
  });
  el.querySelectorAll('[data-adj]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [sid, idxStr, field, deltaStr] = btn.dataset.adj.split('|');
      adjustEx(sid, parseInt(idxStr,10), field, parseFloat(deltaStr));
      if(planDraft){ planDirty(); markPlanDirty(); }
      repaintPlanRow(key);
    });
  });
  // Must be bound here, not in attachWizardHandlers: this button only exists
  // once a row is expanded, which happens via repaintPlanRow rather than a
  // full re-render, so a handler attached at render time would never find it.
  el.querySelector('[data-removeex]')?.addEventListener('click', (ev)=>{
    const [sid, idxStr] = ev.currentTarget.dataset.removeex.split('|');
    const idx = parseInt(idxStr, 10);
    const e = editCtx().exercises[sid][idx];
    if(!e) return;
    const drop = ()=>{
      editCtx().exercises[sid].splice(idx, 1);
      editCtx().openEx = null;
      if(planDraft) planDirty();
      editRepaint();
    };
    // Dropping something you've actually trained is worth a question; a
    // just-added exercise is not.
    if(getHistory(e.id).length){
      showConfirm(
        `Remove <b>${e.name}</b> from this session?<br><br>` +
        `Its logged history is kept — you just stop being prescribed it.`,
        'Remove', drop, { danger:true });
    } else {
      drop();
    }
  });

  el.querySelector('[data-clearfloor]')?.addEventListener('click', (ev)=>{
    const exId = ev.currentTarget.dataset.clearfloor;
    showConfirm(
      `Reset this floor?<br><br>The app will stop holding you to ${num(floorFor(exId))}${unitLabel()} ` +
      `and will set a new floor from your next logged session. Your history is kept.`,
      'Reset floor',
      async ()=>{
        clearFloor(exId);
        invalidatePlans();
        if(editCtx().baselines) delete editCtx().baselines[exId];
        if(editCtx().floors) delete editCtx().floors[exId];
        await saveState();
        repaintPlanRow(key);
      },
      { danger:true }
    );
  });
  return el;
}

        if(gone && wizard.exercises) delete wizard.exercises[gone.id];

    root.querySelector('#finishSetup')?.addEventListener('click', async ()=>{
      const plan = wizardPlan();
      // Store the plan whole — ids, names and all — so it can never be shifted
      // underneath you by a template change later.
      state.setup = normalizeSetup({
        templateId: wizard.templateId,
        routineName: plan.name,
        sessions: plan.sessions,
        dayMap: wizard.dayMap,
        exercises: wizard.exercises,
      });
      // Baselines seed the floors. Ratchet semantics apply even here: editing setup
      // later can raise a floor but never quietly drop one you've already earned.
      Object.keys(wizard.baselines).forEach(exId=>{

}

/* ============================= PLATE VISUAL ============================= */
function platesForSide(weightPerSide){
  const denoms = unitDef().plates;
  let rem = Math.max(0, weightPerSide);
  const plates = [];
  for(const d of denoms){
    while(rem >= d - 0.001){ plates.push(d); rem -= d; }
  }
  return plates;
}
function plateHeight(d){
  const map = {20:40, 15:34, 10:28, 5:22, 2.5:16, 1.25:12};
  return map[d] || 12;
}
function plateWidth(d){ return d>=15 ? 10 : 7; }

function barbellSVG(totalWeight){
  const barW = barWeight();
  const perSide = Math.max(0,(totalWeight - barW))/2;
  const plates = platesForSide(perSide);
  const sideHTML = plates.map(d=>`<div class="plate" style="height:${plateHeight(d)}px; width:${plateWidth(d)}px;"></div>`).join('');
  return `
    <div class="barbell">
      <div class="plate-side left">${sideHTML}</div>
      <div class="bar-rod"></div>
      <div class="plate-side right">${sideHTML}</div>
    </div>
    <div class="loadlabel">${totalWeight>0 ? num(totalWeight) + ' ' + unitLabel() + ' loaded' : 'bar only'}</div>
  `;
}

/* ============================= PROGRESSION LOGIC ============================= */
function getHistory(exId){ return state.history[exId] || []; }
// Warm-ups are stored but never judged — strip them before any progression maths.
function workingSets(sets){
  const w = (sets||[]).filter(s=> !s.warmup);
  return w.length ? w : (sets||[]);
}
function lastSession(exId){
  const h = getHistory(exId);
  if(!h.length) return null;
  const last = h[h.length-1];
  return { ...last, sets: workingSets(last.sets) };
}

/* ---------- The ratchet ----------
   Every exercise carries a floor: a working weight it must never drop below.
   Your baseline week seeds it; a heavier completed session raises it. Nothing
   lowers it. The floor governs what the app SUGGESTS — you can still log
   whatever actually happened on the day. */
function floorFor(exId){
  const v = state.floors[exId];
  return typeof v === 'number' && isFinite(v) ? v : 0;
}

// The heaviest weight you actually completed for at least your minimum reps.
// A heavy partial or a missed set doesn't count as establishing a weight.
function achievedWeight(exSpec, sets){
  let best = 0;
  (sets||[]).forEach(s=>{
    if(s.reps >= exSpec.repMin && s.weight > best) best = s.weight;
  });
  return best;
}

// Ratchet: raise the floor if this session earned it, never lower it.
function raiseFloor(exSpec, sets){
  const earned = achievedWeight(exSpec, sets);
  if(earned > floorFor(exSpec.id)){
    state.floors[exSpec.id] = earned;
    return true;
  }
  return false;
}

/* ---------- The way back down ----------
   A ratchet with no release traps you after an injury or a layoff: every session
   demands a weight you can't currently hit. The floor still never falls on its
   own — but after repeatedly missing it, the app offers to step it down, and you
   can always reset one by hand. */
const DELOAD_TRIGGER = 2;     // consecutive sessions under the floor
const DELOAD_FACTOR = 0.9;    // how far a deload drops it

// How many of the most recent sessions for this exercise came in under the floor.
function consecutiveMisses(exSpec){
  const floor = floorFor(exSpec.id);
  if(floor <= 0) return 0;
  const hist = getHistory(exSpec.id);
  let n = 0;
  for(let i = hist.length - 1; i >= 0; i--){
    const best = Math.max(0, ...workingSets(hist[i].sets).map(s=>s.weight));
    if(best < floor) n++; else break;
  }
  return n;
}
/* Two ways to earn the offer: repeatedly coming in under your floor, or the
   engine finding a plateau — a month at one weight with the best set never
   moving. The second is the one people miss, because nothing looks wrong. */
function shouldOfferDeload(exSpec){
  if(exSpec.isTime) return false;
  if(consecutiveMisses(exSpec) >= DELOAD_TRIGGER) return true;
  return planFor(exSpec).rule === 'plateau';
}
function deloadTarget(exSpec){
  const floor = floorFor(exSpec.id);
  const stepped = roundToPlate(floor * DELOAD_FACTOR, unitKey());
  return Math.max(0, Math.min(stepped, floor - (exSpec.inc || 0)));
}
// Explicit only — never called automatically.
function applyDeload(exSpec){
  const next = deloadTarget(exSpec);
  state.floors[exSpec.id] = next;
  return next;
}
function clearFloor(exId){ delete state.floors[exId]; }

/* ---------- Strength over time ----------
   Epley: a 5-rep set at 100 and a 3-rep set at 107.5 are near-identical efforts,
   and comparing estimated one-rep maxes is what makes those two sessions
   comparable at all. Used for PRs and for the trend line. */
function e1rm(weight, reps){
  const w = +weight || 0, r = +reps || 0;
  if(w <= 0 || r <= 0) return 0;
  return r === 1 ? w : w * (1 + r/30);
}
function bestE1RM(sets){ return Math.max(0, ...(sets||[]).map(s=> e1rm(s.weight, s.reps))); }
function topWeightOf(sets){ return Math.max(0, ...(sets||[]).map(s=> +s.weight || 0)); }

// Strongest session before `exceptDate`, so today can be compared against the past.
function bestBefore(exId, exceptDate){
  let best = 0;
  getHistory(exId).forEach(h=>{
    if(h.date === exceptDate) return;
    best = Math.max(best, bestE1RM(workingSets(h.sets)));
  });
  return best;
}
function isPR(exId, sets, onDate){
  const now = bestE1RM(sets);
  return now > 0 && now > bestBefore(exId, onDate) + 0.01;
}

/* A sparkline of estimated 1RM per session. Inline SVG so it needs no library
   and inherits the theme's colours. */
function sparkline(points, w, h){
  if(!points.length) return '';
  const pad = 4;
  const max = Math.max(...points), min = Math.min(...points);
  const span = (max - min) || 1;
  const stepX = points.length > 1 ? (w - pad*2) / (points.length - 1) : 0;
  const xy = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h - pad - ((p - min)/span) * (h - pad*2);
    return [x, y];
  });
  if(points.length === 1){ xy.push([w - pad, xy[0][1]]); }
  const line = xy.map(([x,y])=> `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const area = `${pad},${h-pad} ${line} ${(w-pad).toFixed(1)},${h-pad}`;
  const last = xy[xy.length-1];
  return `
    <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="${area}" fill="var(--gold-wash)"></polygon>
      <polyline points="${line}" fill="none" stroke="var(--gold)" stroke-width="1.8"
                stroke-linejoin="round" stroke-linecap="round"></polyline>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--gold-bright)"></circle>
    </svg>`;
}

/* ===================== PROGRESSION ENGINE =====================
   One pure function decides what to lift next. It takes everything it needs as
   arguments — no globals, no clock — so the same inputs always give the same
   answer and it can be tested exhaustively or run off the main thread.

   The explanation is produced by the same pass that makes the decision, from
   the same numbers. It cannot describe a rule that wasn't applied.

   Guarantees, enforced at the end of plan() and covered by tests:
     · the weight is loadable on a real bar
     · the weight is never under your floor
     · reps always sit inside the prescribed range
     · every rule carries a headline, a detail and its evidence            */
const PROGRESSION = {
  DETRAIN_DAYS: 21,        // away this long and the last session stops being a fair guide
  STALL_SESSIONS: 2,       // consecutive misses before a deload is worth offering
  PLATEAU_SESSIONS: 4,     // same weight this many times with no rep gain = stuck, not stalling
  DETRAIN_FACTOR: 0.9,
  TREND_WINDOW: 5,         // how many recent sessions the trend is read from

  /* How hard a set was, as reps left in reserve. Three buttons is all anyone
     will actually tap between sets, and three is enough signal: the difference
     that matters is "had room" / "about right" / "nothing left". */
  EFFORT_RIR: { easy: 3, ok: 1, hard: 0 },
  EFFORT_WORD: { easy: 'easy', ok: 'about right', hard: 'hard' },

  round(v, unit){
    const smallest = unit === 'lb' ? 2.5 : 1.25;
    return Math.round(v / smallest) * smallest;
  },
  working(sets){ return (sets || []).filter(s => !s.warmup); },
  daysBetween(a, b){
    return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  },
  /* null, not 0, when nothing was logged — an unrated set must never be read as
     a maximal one. Every effort-aware branch below checks for null first, so a
     history with no ratings produces exactly the answers it did before. */
  rirOf(s){
    const e = s && s.effort;
    return (e && PROGRESSION.EFFORT_RIR[e] !== undefined) ? PROGRESSION.EFFORT_RIR[e] : null;
  },
  e1rm(w, r){
    w = +w || 0; r = +r || 0;
    return r > 0 ? w * (1 + r / 30) : 0;     // Epley
  },

  /* A session only counts as "completed at a weight" if you did the prescribed
     number of sets at that weight. One heavy single then three back-offs is not
     a completed prescription, and treating it as one is how engines drift. */
  topEffort(spec, sets){
    const work = PROGRESSION.working(sets);
    if(!work.length) return null;
    const top = Math.max(...work.map(s => +s.weight || 0));
    const atTop = work.filter(s => (+s.weight || 0) === top);
    // set-by-set, in the order performed — per-set targets are built from this
    const reps = atTop.map(s => +s.reps || 0);
    const rirs = atTop.map(s => PROGRESSION.rirOf(s));
    const rated = rirs.filter(v => v !== null);
    return {
      weight: top,
      setsAtTop: atTop.length,
      complete: atTop.length >= spec.sets,
      minReps: Math.min(...reps),
      maxReps: Math.max(...reps),
      allAtMax: atTop.length >= spec.sets && reps.every(r => r >= spec.repMax),
      allAtMin: atTop.length >= spec.sets && reps.every(r => r >= spec.repMin),
      reps,
      // how hard it was, where you said so — sanitised once, here, so nothing
      // downstream can surface a value the app never wrote
      efforts: atTop.map(s => (s && PROGRESSION.EFFORT_RIR[s.effort] !== undefined) ? s.effort : null),
      rirs,
      rated: rated.length,
      allRated: rated.length > 0 && rated.length === atTop.length,
      avgRIR: rated.length ? rated.reduce((a, b) => a + b, 0) / rated.length : null,
    };
  },

  /* ---------- What the last few sessions say ----------
     One session is noise. A fluke good day sets a target you can't repeat, and
     one bad day inside a clear climb looks identical to a genuine stall. The
     shape of four or five sessions separates them. */
  trend(spec, hist){
    const pts = [];
    for(const h of hist){
      const e = PROGRESSION.topEffort(spec, h.sets);
      if(!e) continue;
      const best = Math.max(0, ...PROGRESSION.working(h.sets)
        .map(s => PROGRESSION.e1rm(s.weight, s.reps)));
      pts.push({ date: h.date, weight: e.weight, maxReps: e.maxReps,
                 complete: !!e.allAtMin, e1rm: Math.round(best * 10) / 10 });
    }

    const win = pts.slice(-PROGRESSION.TREND_WINDOW);
    let dir = null, delta = 0;
    if(win.length >= 2){
      // least-squares slope of estimated 1RM across the window
      const n = win.length, mx = (n - 1) / 2;
      const my = win.reduce((a, p) => a + p.e1rm, 0) / n;
      let num = 0, den = 0;
      win.forEach((p, i) => { num += (i - mx) * (p.e1rm - my); den += (i - mx) * (i - mx); });
      const slope = den ? num / den : 0;
      delta = Math.round((win[n - 1].e1rm - win[0].e1rm) * 10) / 10;
      // half a percent of your current strength per session is inside the noise
      const eps = Math.max(0.25, my * 0.005);
      dir = slope > eps ? 'up' : (slope < -eps ? 'down' : 'flat');
    }

    /* Consecutive recent sessions at the same top weight where the best set
       never improved. Reps still climbing is progress, so that resets it —
       otherwise every double-progression block would read as a plateau. */
    let stuck = 0;
    if(pts.length){
      const topW = pts[pts.length - 1].weight;
      for(let i = pts.length - 1; i >= 0 && pts[i].weight === topW; i--) stuck++;
      const run = pts.slice(pts.length - stuck);
      if(run.some((p, i) => i > 0 && p.maxReps > run[0].maxReps)) stuck = 0;
    }

    return { points: pts, window: win, dir, delta, stuck };
  },

  plan(input){
    const spec  = input.spec;
    const unit  = input.unit || 'kg';
    const floor = Math.max(0, +input.floor || 0);
    const today = input.today;
    const hist  = (input.history || [])
      .filter(h => PROGRESSION.working(h.sets).length)
      .slice()
      .sort((a, b) => a.date < b.date ? -1 : 1);

    const unitLbl = unit === 'lb' ? 'lb' : 'kg';
    const n = v => String(+(+v).toFixed(2));
    const ev = [];
    let rule, weight, reps, headline, detail;

    // ---------- nothing to go on ----------
    if(!hist.length){
      if(floor > 0){
        rule = 'baseline';
        weight = floor; reps = spec.repMin;
        headline = 'Start at your baseline';
        detail = `You set a floor of ${n(floor)}${unitLbl} for this lift and haven't logged it yet, so that's where it begins.`;
        ev.push({ k:'floor', t:`Floor ${n(floor)}${unitLbl}` });
      } else {
        rule = 'unknown';
        weight = null; reps = spec.repMin;
        headline = 'First time';
        detail = 'Nothing logged for this lift yet — whatever you do today becomes the baseline it works from.';
      }
      return PROGRESSION.finish({ spec, unit, floor, rule, weight, reps, headline, detail, ev, last:null,
        trend:{ points:[], window:[], dir:null, delta:0, stuck:0 },
        confidence:'low', confidenceWhy:'nothing logged for this lift yet' });
    }

    const last = hist[hist.length - 1];
    const eff  = PROGRESSION.topEffort(spec, last.sets);
    const gap  = today ? PROGRESSION.daysBetween(last.date, today) : 0;
    const tr   = PROGRESSION.trend(spec, hist);
    ev.push({ k:'last', t:`Last time: ${eff.reps.map(r => `${n(eff.weight)}${unitLbl}×${r}`).join(', ')}` });
    if(eff.rated){
      ev.push({ k:'effort', t:`Felt: ${eff.efforts.map(e =>
        e ? PROGRESSION.EFFORT_WORD[e] : 'unrated').join(', ')}` });
    }
    if(tr.dir){
      const w = tr.window;
      ev.push({ k:'trend', t:`Est. 1RM over ${w.length} sessions: ${n(w[0].e1rm)} → ` +
        `${n(w[w.length-1].e1rm)}${unitLbl} (${tr.dir}${tr.delta ? `, ${tr.delta > 0 ? '+' : ''}${n(tr.delta)}` : ''})` });
    }

    // consecutive sessions that failed to complete the prescription
    let misses = 0;
    for(let i = hist.length - 1; i >= 0; i--){
      const e = PROGRESSION.topEffort(spec, hist[i].sets);
      if(e && e.allAtMin) break;
      misses++;
    }

    /* Was the last session a bad day or the start of a real stall? A single
       miss inside a climb is a bad day; the same miss on a flat or falling
       trend is the thing the stall rule exists for. */
    const badDay = misses === 1 && tr.dir === 'up' && hist.length >= 3;

    // ---------- the ladder; first match wins ----------
    if(gap >= PROGRESSION.DETRAIN_DAYS){
      rule = 'return';
      weight = PROGRESSION.round(eff.weight * PROGRESSION.DETRAIN_FACTOR, unit);
      reps = spec.repMin;
      headline = 'Ease back in';
      detail = `It's been ${gap} days since you trained this. Starting about 10% under your last working weight gives you a session to find it again.`;
      ev.push({ k:'gap', t:`${gap} days since the last session` });

    } else if(!eff.allAtMax && eff.weight > 0 && tr.stuck >= PROGRESSION.PLATEAU_SESSIONS){
      /* Sitting at the same weight for a month with the best set never moving
         is a different problem from missing twice, and holding is not the
         answer to it. Caught here, above stall, because it is the more specific
         diagnosis — and it needs a deload rather than another attempt. */
      rule = 'plateau';
      weight = eff.weight; reps = spec.repMin;
      /* The weight is held rather than dropped: only a deliberate deload moves
         the floor, and suggesting a weight the floor would claw back next
         session is worse than saying nothing. So this names the diagnosis and
         points at the button that acts on it, and today still has a real
         target — the per-set numbers below are unchanged. */
      headline = 'Stuck at this weight';
      detail = `${tr.stuck} sessions at ${n(eff.weight)}${unitLbl} and your best set hasn't moved — ` +
               `that's a plateau, not a bad run. Today's targets stand, but if this one misses too, ` +
               `use Deload on this lift's page: it drops your floor about 10% so you can climb back into it. ` +
               `That usually clears a plateau inside three sessions.`;
      ev.push({ k:'plateau', t:`${tr.stuck} sessions stuck at ${n(eff.weight)}${unitLbl}` });

    } else if(misses >= PROGRESSION.STALL_SESSIONS){
      rule = 'stall';
      weight = eff.weight; reps = spec.repMin;
      headline = 'Same weight again';
      /* A stall only means "too heavy" if you were actually near your limit.
         Repeatedly missing sets that felt easy is a different problem, and
         telling you to deload for it would be the wrong advice. */
      const easyStall = eff.avgRIR !== null && eff.avgRIR >= 2;
      if(easyStall){
        detail = `You've fallen short of ${spec.repMin} reps ${misses} sessions running — but you logged those sets as easy. ` +
                 `That isn't the weight being too heavy, so don't drop it. Take the next one closer to failure.`;
      } else {
        detail = `You've fallen short of ${spec.repMin} reps ${misses} sessions running. Hold here — and if the next one misses too, dropping about 10% is the faster way back up.`;
      }
      ev.push({ k:'stall', t:`${misses} sessions short of ${spec.repMin} reps` });

    } else if(eff.allAtMax){
      rule = 'progress';
      const base = spec.inc || 0;

      /* Size the jump to how much was left in the tank. Clearing the top of
         the range with three reps in reserve and clearing it by a whisker are
         the same event to a plain +2.5kg, and they should not be. */
      let mult = 1, room = '';
      if(base > 0 && eff.avgRIR !== null && eff.allRated){
        if(eff.avgRIR >= 2.5){ mult = 2;   room = 'every set logged easy'; }
        else if(eff.avgRIR >= 1.5){ mult = 1.5; room = 'those sets had room left'; }
        else if(eff.avgRIR <= 0.5){ room = 'they were hard-earned'; }
      }
      weight = PROGRESSION.round(eff.weight + base * mult, unit);
      // never let rounding hand back a jump that isn't actually bigger
      if(mult > 1) weight = Math.max(weight, PROGRESSION.round(eff.weight + base, unit));
      reps = spec.repMin;

      // The headline quotes the jump that was applied, not the one intended,
      // so rounding can never make the card contradict the steppers.
      const applied = weight - eff.weight;
      headline = applied > 0 ? `Add ${n(applied)}${unitLbl}` : 'Push for more reps';
      detail = `You hit ${spec.repMax} reps on all ${spec.sets} sets at ${n(eff.weight)}${unitLbl} — the top of your range. That's the signal to add weight and start the range again.`;
      if(room && mult > 1) detail += ` And ${room}, so this is a bigger step than the usual ${n(base)}${unitLbl}.`;
      else if(room) detail += ` And ${room}, so this is the standard step.`;
      ev.push({ k:'rule', t:`All ${spec.sets} sets reached ${spec.repMax} reps` });
      if(mult > 1) ev.push({ k:'effort', t:`Effort sized the jump: ${n(base)} → ${n(applied)}${unitLbl}` });

    } else if(eff.allAtMin){
      rule = 'add-reps';
      weight = eff.weight;
      reps = Math.min(spec.repMax, eff.minReps + 1);
      // No single number here: each set carries its own target, and a headline
      // quoting one of them would contradict the others on screen.
      headline = 'Beat each set';
      detail = `Same weight. Every set has its own number — beat what that set did last time. ` +
               `Your weakest was ${eff.minReps}; clear all ${spec.sets} at ${spec.repMax} and the weight goes up.`;
      // A set with reps to spare doesn't need the one-at-a-time crawl, and the
      // per-set targets below say so — flag it here too so the two agree.
      if(eff.rirs.some((v, i) => v !== null && v >= 2 && eff.reps[i] < spec.repMax)){
        detail += ` Sets you logged as easy skip straight to ${spec.repMax} rather than crawling up one rep at a time.`;
      }
      ev.push({ k:'rule', t:`Last set-by-set: ${eff.reps.join(', ')} of a target ${spec.repMax}` });

    } else if(!eff.complete){
      rule = 'incomplete';
      weight = eff.weight; reps = spec.repMin;
      headline = 'Finish the sets';
      detail = `You logged ${eff.setsAtTop} of ${spec.sets} sets at ${n(eff.weight)}${unitLbl} last time. Complete all ${spec.sets} before the weight moves.`;
      ev.push({ k:'rule', t:`${eff.setsAtTop} of ${spec.sets} sets completed` });

    } else {
      rule = 'repeat';
      weight = eff.weight; reps = spec.repMin;
      headline = 'Same weight';
      detail = `One or more sets came in under ${spec.repMin} reps last time. Stay here until all ${spec.sets} clear ${spec.repMin}.`;
      // One miss inside a climb is a bad day, and saying so is the difference
      // between "you're stuck" and "that happens" on a screen you read tired.
      if(badDay) detail += ` Your estimated 1RM is still climbing across the last ${tr.window.length} sessions, so that reads as one off day rather than the weight running out.`;
      ev.push({ k:'rule', t:`Fell short of ${spec.repMin} reps` });
      if(badDay) ev.push({ k:'trend', t:'Trend still up — treated as a bad day' });
    }

    if(floor > 0) ev.push({ k:'floor', t:`Floor ${n(floor)}${unitLbl}` });

    /* ---------- how much to trust this ----------
       Presenting a guess from one session with the same certainty as a call
       backed by five is the fastest way to lose the user's trust the first
       time it's wrong. Say which one this is. */
    let conf = 'high', confWhy = '';
    if(hist.length <= 1){ conf = 'low'; confWhy = 'only one session to read'; }
    else if(gap >= PROGRESSION.DETRAIN_DAYS){ conf = 'low'; confWhy = `${gap} days since you trained this`; }
    else if(hist.length < 4){ conf = 'medium'; confWhy = `${hist.length} sessions logged`; }
    else if(!eff.rated){ conf = 'medium'; confWhy = 'no effort logged, so the size of the step is a guess'; }
    else if(tr.dir === 'down'){ conf = 'medium'; confWhy = 'your recent trend is downward'; }
    ev.push({ k:'conf', t:`Confidence: ${conf}${confWhy ? ` — ${confWhy}` : ' — consistent recent history'}` });

    return PROGRESSION.finish({ spec, unit, floor, rule, weight, reps, headline, detail, ev,
                                last, gap, trend: tr, confidence: conf, confidenceWhy: confWhy });
  },

  /* Everything that must be true of any plan, applied in one place so no rule
     above can forget it. */
  finish(o){
    const spec = o.spec, unit = o.unit;
    let weight = o.weight, reps = o.reps, rule = o.rule;
    let headline = o.headline, detail = o.detail;
    const ev = o.ev.slice();

    if(weight !== null && weight !== undefined){
      weight = PROGRESSION.round(Math.max(0, weight), unit);

      /* The floor outranks every rule: a bad day must never drag the next
         session down. When it bites, the explanation has to change with it —
         a card that says "same weight" while showing a heavier bar is the kind
         of inconsistency that makes the whole thing untrustworthy. */
      if(o.floor > 0 && weight < o.floor){
        const wanted = weight;
        const u = unit === 'lb' ? 'lb' : 'kg';
        const nf = String(+(+o.floor).toFixed(2));
        weight = o.floor;
        ev.push({ k:'clamp', t:`Rule suggested ${String(+(+wanted).toFixed(2))}${u} — floor applied` });
        if(rule === 'return'){
          detail += ` Your floor of ${nf}${u} sits above that, so it starts there — reset the floor on the Plan screen if it feels too heavy.`;
        } else {
          rule = 'floor';
          headline = `Back to your floor`;
          detail = `Last time you worked at ${String(+(+wanted).toFixed(2))}${u}, under your floor of ${nf}${u}. ` +
                   `The floor is weight you've already proven you can handle, so the target goes back to it rather than following a bad day down.`;
        }
      }

      // A heavier bar than last time means the rep target starts over.
      const lastTop = o.last ? (PROGRESSION.topEffort(spec, o.last.sets) || {}).weight : null;
      if(lastTop !== null && lastTop !== undefined && weight > lastTop) reps = spec.repMin;
    }

    reps = Math.min(spec.repMax, Math.max(spec.repMin, Math.round(reps)));

    /* ---------- a target for every set ----------
       Set four is not set one. You beat last session set for set, so each set
       gets its own number rather than one figure applied four times.

         · heavier bar than last time -> the range restarts, every set aims low
         · same bar -> beat what THAT set did, capped at the top of the range
         · that set had reps to spare -> go straight to the top, skip the crawl
         · a set you didn't complete last time -> just complete it

       The exercise only advances when every set reaches the top, so these add
       up to the same rule the headline describes. */
    const lastEff = o.last ? PROGRESSION.topEffort(spec, o.last.sets) : null;
    const lastTopW = lastEff ? lastEff.weight : null;
    const sameBar = lastTopW !== null && weight !== null && weight === lastTopW;
    const clampR = r => Math.min(spec.repMax, Math.max(spec.repMin, r));
    const targets = [];
    for(let i = 0; i < spec.sets; i++){
      const did = sameBar && lastEff ? lastEff.reps[i] : undefined;
      const rir = sameBar && lastEff ? lastEff.rirs[i] : null;
      let r, why;
      if(!sameBar){
        r = spec.repMin;
        why = weight !== null && lastTopW !== null && weight > lastTopW
          ? 'new weight, range restarts' : 'start of the range';
      } else if(did === undefined){
        r = spec.repMin;
        why = 'you did not reach this set last time';
      } else if(did >= spec.repMax){
        r = spec.repMax;
        why = `hold ${spec.repMax}`;
      } else if(rir !== null && rir >= 2){
        /* Asking for one more rep than a set you finished with three in the
           tank wastes a session. The rest of the ladder is unchanged, so this
           only ever shortens the climb — it never demands more than the top. */
        r = spec.repMax;
        why = `${did} felt easy — go to ${spec.repMax}`;
      } else {
        r = clampR(did + 1);
        why = rir === 0 ? `${did} was hard — one more` : `beat ${did}`;
      }
      targets.push({ set: i + 1, weight, reps: r,
                     was: did === undefined ? null : did,
                     wasEffort: (sameBar && lastEff && lastEff.efforts[i]) || null, why });
    }

    return {
      weight, reps, sets: spec.sets, rule, headline, detail,
      targets,
      // the exercise advances only when every set clears the top of the range
      allAtTop: targets.every(t => t.reps >= spec.repMax),
      evidence: ev,
      atFloor: o.floor > 0 && weight === o.floor,
      trend: o.trend || { points:[], window:[], dir:null, delta:0, stuck:0 },
      confidence: o.confidence || 'low',
      confidenceWhy: o.confidenceWhy || '',
      unit,
    };
  },

  /* ---------- Reacting to what already happened today ----------
     A plan built from history alone still asks set 4 for a number you just
     failed on set 2. This re-reads the same targets against the sets already
     logged this session. Pure, and applied at paint time rather than baked
     into the cached plan, so the cache stays keyed on history alone.

       · a set you beat  -> later sets ask for at least what you just did
       · a set you missed AND logged as hard -> later sets are capped there

     A miss that wasn't hard is left alone: that's a focus problem, and quietly
     lowering the bar for it is how an app teaches you to coast. */
  adjust(plan, doneToday, spec){
    if(!plan || !plan.targets || !plan.targets.length) return plan;
    const done = doneToday || [];
    if(!done.length) return plan;

    const clampAdj = v => Math.min(spec.repMax, Math.max(spec.repMin, v));
    let cap = null, capWhy = '', raise = 0, moved = false;
    const targets = plan.targets.map((t, i) => {
      const d = done[i];
      if(d && d.done && !d.warmup){
        const reps = +d.reps || 0;
        const rir = PROGRESSION.rirOf(d);
        if(reps < t.reps && rir === 0){ cap = reps; capWhy = `set ${i + 1} was all you had`; }
        else if(reps > t.reps){ raise = Math.max(raise, reps); }
        return t;
      }
      let r = t.reps, why = t.why;
      if(raise > r){ r = clampAdj(raise); why = `you already did ${raise}`; }
      // a later hard miss outranks an earlier overshoot — you're fatiguing, not fresh
      if(cap !== null && r > cap){ r = clampAdj(cap); why = capWhy; }
      if(r === t.reps) return t;
      moved = true;
      return { ...t, reps: r, why, adjusted: true };
    });

    if(!moved) return plan;
    return { ...plan, targets, allAtTop: targets.every(t => t.reps >= spec.repMax) };
  },
};

/* ---------- Running the engine off the main thread ----------
   The worker's source is generated from the PROGRESSION object itself, so there
   is still only one copy of the rules — a second hand-written implementation
   would be free to drift, which is the usual way engines like this go wrong.

   Results are cached per exercise and invalidated whenever history, floors or
   units change. If Workers are unavailable the same function runs inline; the
   answer is identical either way, which the tests assert. */
let planWorker = null, planCache = new Map(), planSeq = 0;

/* The key has to cover the actual sets, not just how many sessions there are.
   Keying on length and last date alone meant that editing a logged session —
   same day, same set count, different reps — returned the previous plan. */
function historyHash(h){
  let a = 2166136261;                      // FNV-1a over the whole history
  const mix = s => { for(let i=0;i<s.length;i++){ a ^= s.charCodeAt(i); a = Math.imul(a, 16777619); } };
  for(const sess of h){
    mix(sess.date);
    for(const s of sess.sets) mix((s.weight||0) + 'x' + (s.reps||0) + (s.warmup ? 'w' : '') + (s.effort || ''));
  }
  return (a >>> 0).toString(36);
}
function planCacheKey(exSpec, asOf){
  const h = getHistory(exSpec.id);
  return [exSpec.id, h.length, historyHash(h), floorFor(exSpec.id),
          unitKey(), exSpec.sets, exSpec.repMin, exSpec.repMax, exSpec.inc,
          asOf || todayKey()].join('|');
}
function invalidatePlans(){ planCache.clear(); }

function startPlanWorker(){
  if(planWorker !== null) return planWorker;
  try{
    if(typeof Worker === 'undefined' || typeof Blob === 'undefined'){ planWorker = false; return false; }
    const src = 'const PROGRESSION = ' + serializeEngine() + ';\n' +
      'self.onmessage = function(e){\n' +
      '  var jobs = e.data.jobs, out = [];\n' +
      '  for(var i=0;i<jobs.length;i++){\n' +
      '    out.push({ key: jobs[i].key, plan: PROGRESSION.plan(jobs[i].input) });\n' +
      '  }\n' +
      '  self.postMessage({ seq: e.data.seq, out: out });\n' +
      '};';
    planWorker = new Worker(URL.createObjectURL(new Blob([src], {type:'application/javascript'})));
    planWorker.onmessage = (e)=>{
      e.data.out.forEach(r => planCache.set(r.key, r.plan));
      if(typeof onPlansReady === 'function') onPlansReady();
    };
    planWorker.onerror = ()=>{ planWorker = false; };   // fall back to inline
  }catch(err){ planWorker = false; }
  return planWorker;
}

/* Turn the engine object into source the worker can evaluate.
   Shorthand methods stringify as "name(args){...}", which is a syntax error as
   an object-literal value — they need the `function` keyword putting back. */
function serializeEngine(){
  const parts = Object.keys(PROGRESSION).map(k=>{
    const v = PROGRESSION[k];
    if(typeof v !== 'function') return JSON.stringify(k) + ':' + JSON.stringify(v);
    let src = String(v).trim();
    const alreadyValid = /^(function\b|async\b|\()/.test(src) || /^[A-Za-z_$][\w$]*\s*=>/.test(src);
    if(!alreadyValid) src = 'function ' + src;
    return JSON.stringify(k) + ':' + src;
  });
  return '{' + parts.join(',\n') + '}';
}

/* Ask for plans ahead of time so the gym screen never computes while painting. */
function precomputePlans(exercises, asOf){
  const when = asOf || todayKey();
  const w = startPlanWorker();
  const jobs = [];
  exercises.forEach(exSpec=>{
    const key = planCacheKey(exSpec, when);
    if(planCache.has(key)) return;
    jobs.push({ key, input:{
      spec: exSpec, history: getHistory(exSpec.id), floor: floorFor(exSpec.id),
      today: when, unit: unitKey(),
    }});
  });
  if(!jobs.length) return;
  if(w) w.postMessage({ seq: ++planSeq, jobs });
  else jobs.forEach(j => planCache.set(j.key, PROGRESSION.plan(j.input)));
}

/* The rest of the app asks for a target through here. It is a thin shim over the
   engine so there is exactly one set of progression rules in the codebase. */
/* `asOf` is the date the session is being planned FOR, which is not always
   today: backfilling a missed day, or replaying history, must measure the gap
   since the last session against that day, not this one. */
function planFor(exSpec, asOf){
  const when = asOf || todayKey();
  const key = planCacheKey(exSpec, when);
  if(planCache.has(key)) return planCache.get(key);
  const p = PROGRESSION.plan({
    spec: exSpec,
    history: getHistory(exSpec.id),
    floor: floorFor(exSpec.id),
    today: when,
    unit: unitKey(),
  });
  planCache.set(key, p);
  return p;
}
function suggestTarget(exSpec, asOf){
  const p = planFor(exSpec, asOf);
  return { weight: p.weight, note: p.detail, atFloor: p.atFloor, plan: p };
}

/* The plan as it stands right now, mid-session: the cached history-based plan
   re-read against the sets already logged today. Everything the gym screen
   shows and prefills goes through here, so the strip, the steppers and the
   Why panel cannot disagree about what this set is asking for. */
function livePlan(exSpec){
  const p = planFor(exSpec, focus.date);
  return PROGRESSION.adjust(p, sessionDraft[exSpec.id] || [], exSpec);
}

/* ============================= WORKOUT SESSION — GYM FOCUS MODE ============================= */
// One set, one screen. No typing required — big +/- steppers. Auto-advances through
// every set of every exercise in order, then shows a finish screen.
let sessionDraft = {};   // exId -> [{weight,reps,done,touched}]
let focus = { exercises:[], flat:[], pos:0, sessionName:'', sessionId:'', active:false, restEnd:null };
// flat = [{exIdx, setIdx}] linear walk order through all sets, for simple prev/next + dot progress

function num(n){ return String(+(+n).toFixed(2)); }   // 62.50 -> "62.5", 60.00 -> "60"
function buzz(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }

/* Keep the screen on mid-workout — a phone locking between sets is the single most
   annoying thing a gym logger can do. Silently unavailable on unsupported browsers. */
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on){
      if(!wakeLock && navigator.wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
      }
    } else if(wakeLock){
      const w = wakeLock; wakeLock = null; await w.release();
    }
  }catch(e){ /* unsupported, or denied in the background — non-fatal */ }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && focus.active) keepAwake(true);
});

/* The numbers on screen should already be right, so logging a set is one tap.
   Each set gets ITS own target from the engine. Carry-forward only takes over
   when you have gone off-plan — changed the bar mid-exercise — because at that
   point the per-set plan no longer describes what you are doing. */
function ensureDefaults(exSpec, setIdx){
  const rows = sessionDraft[exSpec.id];
  const row = rows[setIdx];
  if(row.done || row.touched) return row;

  const plan = livePlan(exSpec);
  const target = plan.targets && plan.targets[setIdx];

  // the most recent set you actually completed for this exercise today
  let prev = null;
  for(let i = setIdx - 1; i >= 0; i--){ if(rows[i].done){ prev = rows[i]; break; } }

  if(plan.weight === null || plan.weight === undefined){
    // nothing to go on: follow yourself
    row.weight = prev ? prev.weight : 0;
    row.reps = prev ? prev.reps : exSpec.repMin;
    return row;
  }

  const onPlan = !prev || (parseFloat(prev.weight) || 0) === plan.weight;
  row.weight = onPlan ? plan.weight : prev.weight;

  /* The target already accounts for today — livePlan() raises it to what you
     just did and caps it after a set you logged as hard. Take it as given so
     the number on the stepper is the number on the strip. */
  const want = onPlan && target ? target.reps : (onPlan ? plan.reps : exSpec.repMin);
  row.reps = clamp(want, exSpec.repMin, exSpec.repMax);
  return row;
}

function renderSession(sessionId, isReview, forDate){
  const session = sessionById(sessionId);
  if(!session) return renderHome();
  // A copy, so a mid-session swap doesn't rewrite your saved routine.
  const exercises = exercisesFor(sessionId).slice();
  const tKey = forDate || todayKey();

  sessionDraft = {};
  const flat = [];
  exercises.forEach((exSpec, exIdx)=>{
    let existing = null;
    if(isReview && state.completions[tKey] && state.completions[tKey][exSpec.id]){
      existing = state.completions[tKey][exSpec.id].sets;
    }
    const rows = [];
    for(let i=0;i<exSpec.sets;i++){
      if(existing && existing[i]){ rows.push({...existing[i], done:true, touched:true}); }
      // left null on purpose — filled by ensureDefaults() at paint time so each set
      // can inherit whatever you actually lifted on the set before it
      else { rows.push({ weight:null, reps:null, done:false, touched:false, warmup:false, effort:null }); }
      flat.push({exIdx, setIdx:i});
    }
    sessionDraft[exSpec.id] = rows;
  });

  // An emptied session has nothing to walk through, and paintFocus would read
  // flat[0] of an empty list.
  if(!flat.length){ focus.active = false; return renderHome(); }

  // resume at first not-done set (fresh sessions: pos 0; review: land at start)
  let startPos = 0;
  if(!isReview){
    const firstUndone = flat.findIndex(f=>{
      const exSpec = exercises[f.exIdx];
      return !sessionDraft[exSpec.id][f.setIdx].done;
    });
    startPos = firstUndone === -1 ? 0 : firstUndone;
  }

  focus = { exercises, flat, pos: startPos, sessionName: session.name, sessionId,
            date: tKey, active:true, restEnd:null, restLen:0, restDinged:false,
            lastLogged:null };
  whyOpen = false;
  precomputePlans(exercises, tKey);   // off the main thread, before the first paint
  keepAwake(true);
  paintFocus();
}

/* ---------- Rest timer ---------- */
// Rest length is inferred from the rep range so there is nothing to configure.
// Keyed off repMin — the heavy end of the range is what sets the load, and the
// load is what dictates recovery. A 6-8 squat is a strength set; an 8-12 curl isn't.
function defaultRest(exSpec){
  if(exSpec.isTime) return 60;
  if(exSpec.repMin <= 5) return 180;
  if(exSpec.repMin <= 8) return 150;
  if(exSpec.repMin <= 12) return 90;
  return 60;
}
/* If you've switched apps mid-rest the vibration is easy to miss, so ask the OS
   to tell you. Permission is requested on the first rest, never on load, and the
   whole thing is optional — the countdown works regardless. */
function notifyRestOver(){
  try{
    if(typeof Notification === 'undefined') return;
    if(document.visibilityState === 'visible') return;      // you're looking at it
    if(Notification.permission !== 'granted') return;
    const { exSpec } = currentCell();
    new Notification('Rest over', {
      body: exSpec ? `Next: ${exSpec.name}` : 'Back to it.',
      tag: 'auxano-rest',
      silent: false,
    });
  }catch(e){ /* unsupported or blocked — the on-screen timer still works */ }
}
function askRestNotifications(){
  try{
    if(typeof Notification === 'undefined') return;
    if(Notification.permission === 'default') Notification.requestPermission();
  }catch(e){}
}

let restTimer = null;
function startRest(sec){
  askRestNotifications();
  focus.restLen = sec;
  focus.restEnd = Date.now() + sec*1000;
  focus.restDinged = false;
  if(!restTimer) restTimer = setInterval(tickRest, 250);
}
function stopRest(){
  focus.restEnd = null;
  if(restTimer){ clearInterval(restTimer); restTimer = null; }
  root.querySelector('#restBand')?.remove();
}
function restRemaining(){
  return focus.restEnd ? Math.max(0, Math.ceil((focus.restEnd - Date.now())/1000)) : 0;
}
function fmtClock(s){ return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function tickRest(){
  const band = root.querySelector('#restBand');
  if(!band) return;                       // not on a set screen right now
  const left = restRemaining();
  const t = band.querySelector('#restTime');
  const bar = band.querySelector('#restBar');
  if(left > 0){
    if(t) t.textContent = fmtClock(left);
    if(bar) bar.style.width = (100 * (1 - left/focus.restLen)) + '%';
  } else if(!focus.restDinged){
    focus.restDinged = true;
    buzz([50,80,50]);
    notifyRestOver();
    band.classList.add('ready');
    if(t) t.textContent = 'GO';
    if(bar) bar.style.width = '100%';
    const lbl = band.querySelector('#restLabel');
    if(lbl) lbl.textContent = 'Rested';
    // Nothing left to count — stop waking the CPU 4x a second. The band stays
    // on screen reading GO until the next set is logged.
    clearInterval(restTimer); restTimer = null;
  }
}
function restBandHTML(){
  if(!focus.restEnd) return '';
  const left = restRemaining();
  const ready = left <= 0;
  const pct = ready ? 100 : 100 * (1 - left/focus.restLen);
  return `
    <div class="restband ${ready?'ready':''}" id="restBand">
      <div class="restrow">
        <div>
          <div class="restlabel" id="restLabel">${ready ? 'Rested' : 'Rest'}</div>
          <div class="resttime" id="restTime">${ready ? 'GO' : fmtClock(left)}</div>
        </div>
        <div class="restacts">
          <button id="rest30">+30s</button>
          <button id="restSkip">Skip</button>
        </div>
      </div>
      <div class="restbar"><i id="restBar" style="width:${pct}%"></i></div>
      ${effortRowHTML(effortSubject(), true)}
    </div>
  `;
}

function currentCell(){
  const f = focus.flat[focus.pos];
  const exSpec = focus.exercises[f.exIdx];
  const row = sessionDraft[exSpec.id][f.setIdx];
  return { f, exSpec, row };
}

// What the Log button is about to record, in words: "60kg × 8"
function setLabel(exSpec, row){
  const w = parseFloat(row.weight)||0;
  const r = parseFloat(row.reps)||0;
  const rr = exSpec.isTime ? r+'s' : r;
  return w > 0 ? `${num(w)}${unitLabel()} × ${rr}` : (exSpec.isTime ? `${rr}` : `${rr} reps`);
}
/* The floor, shown where you're about to act on it. Going under is allowed —
   it just says so, and the finish screen will ask what happened. */
/* What to hit, and why — stated before you touch the steppers. The headline is
   the instruction, the detail is the reasoning, and the evidence underneath is
   the actual numbers it read. */
const RULE_ICON = {
  progress:'↑', 'add-reps':'+', repeat:'=', incomplete:'=', stall:'!',
  return:'↓', baseline:'●', unknown:'?', plateau:'~', floor:'▲',
};
let whyOpen = false;

function targetCardHTML(exSpec, row){
  const p = livePlan(exSpec);
  if(p.weight === null || p.weight === undefined){
    return `<div class="targetcard first">
        <div class="tgtwhy">${p.detail}</div>
      </div>`;
  }
  const { f } = currentCell();
  const idx = f.setIdx;
  const t = (p.targets && p.targets[idx]) || { reps: p.reps, why:'' };
  const unit = exSpec.isTime ? 's' : unitLabel();
  const rows = sessionDraft[exSpec.id] || [];

  const target = exSpec.isTime
    ? `<b>${t.reps}</b><span class="tu">${unit}</span>`
    : `<b>${num(p.weight)}</b><span class="tu">${unit}</span><span class="tx">×</span><b>${t.reps}</b>`;

  /* The plan for the whole exercise, so you can see what's coming and whether
     the set you just did met its own number. */
  const strip = (p.targets || []).map((tg, i)=>{
    const done = rows[i] && rows[i].done;
    const hit  = done && (parseFloat(rows[i].reps) || 0) >= tg.reps
                      && (parseFloat(rows[i].weight) || 0) >= tg.weight;
    const cls = [i === idx ? 'now' : (done ? (hit ? 'hit' : 'miss') : ''),
                 tg.adjusted ? 'adj' : ''].filter(Boolean).join(' ');
    return `<span class="tsl ${cls}"><i>${i+1}</i>${tg.reps}</span>`;
  }).join('');

  return `
    <div class="targetcard rule-${p.rule}">
      <div class="tgtrow">
        <span class="tgtlbl">Set ${idx+1} target</span>
        <span class="tgtval">${target}</span>
      </div>
      ${p.targets && p.targets.length > 1 ? `<div class="tgtstrip">${strip}</div>` : ''}
      <button class="tgthead" id="whyBtn" aria-expanded="${whyOpen}">
        <span class="tgticon">${RULE_ICON[p.rule] || '·'}</span>
        <span class="tgttext">${p.headline}${t.why ? ` · <span class="tgtsub">${t.why}</span>` : ''}</span>
        <span class="tgtchev">${whyOpen ? 'Hide' : 'Why'}</span>
      </button>
      ${whyOpen ? `
        <div class="tgtwhy">
          ${p.detail}
          <ul class="tgtev">
            ${p.evidence.map(e=>`<li class="ev-${e.k}">${e.t}</li>`).join('')}
            ${p.targets.map(tg=>`<li class="ev-set">Set ${tg.set}: ${tg.reps} reps${
              tg.was === null ? '' : ` — you did ${tg.was}${
                tg.wasEffort ? `, ${PROGRESSION.EFFORT_WORD[tg.wasEffort]}` : ''}`}${
              tg.adjusted ? ' · adjusted for today' : ''}</li>`).join('')}
          </ul>
        </div>` : ''}
    </div>`;
}

/* ---------- How hard was it? ----------
   The one thing the engine could never see. Three buttons, offered while you
   are standing still anyway, in the place your eyes already are — the rest
   band. Skipping it costs nothing: with no rating the engine falls back to
   exactly the answers it gave before any of this existed. */
const EFFORTS = [
  { k:'easy', lbl:'Easy',  hint:'2+ reps left' },
  { k:'ok',   lbl:'Right', hint:'about 1 left' },
  { k:'hard', lbl:'Hard',  hint:'nothing left' },
];

// Which set the effort buttons are asking about, if any.
function effortSubject(){
  const { f, exSpec, row } = currentCell();
  // standing on a set you already logged — rate it, or change what you said
  if(row.done && !row.warmup) return { exSpec, row, setIdx:f.setIdx, here:true };
  // resting after logging one — that is the set being asked about
  const ll = focus.lastLogged;
  if(!ll || !focus.restEnd) return null;
  const rows = sessionDraft[ll.exId];
  const r = rows && rows[ll.setIdx];
  if(!r || !r.done || r.warmup) return null;
  const ex = focus.exercises.find(e => e.id === ll.exId);
  return ex ? { exSpec: ex, row: r, setIdx: ll.setIdx, here:false } : null;
}

/* Asked in whichever place is already on screen. While you're resting it rides
   inside the rest band, so it costs no extra height at the exact moment the
   screen is busiest; standing on a set you already logged, it stands alone. */
function effortRowHTML(s, inBand){
  if(!s || !!s.here === !!inBand) return '';
  const chosen = s.row.effort;
  const label = chosen
    ? `Set ${s.setIdx+1} felt ${PROGRESSION.EFFORT_WORD[chosen]}`
    : (inBand ? 'How did that set feel?' : `How did set ${s.setIdx+1} feel?`);
  const btns = EFFORTS.map(e=>`
    <button class="efbtn ${chosen === e.k ? 'on' : ''}" data-eff="${e.k}"
      aria-pressed="${chosen === e.k}" title="${e.hint}">${e.lbl}</button>`).join('');
  return `
    <div class="effortbar ${inBand ? 'inband' : ''} ${chosen ? 'rated' : ''}" id="effortBar">
      <div class="eflbl">${label}</div>
      <div class="efbtns">${btns}</div>
    </div>`;
}
function effortBarHTML(){ return effortRowHTML(effortSubject(), false); }

function floorNoteHTML(exSpec, row){
  const floor = floorFor(exSpec.id);
  if(exSpec.isTime || floor <= 0) return '';
  const w = parseFloat(row.weight) || 0;
  if(w < floor) return `<span class="under">Under your floor of ${num(floor)}${unitLabel()}</span>`;
  if(w === floor) return `<span class="at">At your floor · ${num(floor)}${unitLabel()}</span>`;
  return `<span class="above">Floor ${num(floor)}${unitLabel()} · +${num(w - floor)}${unitLabel()}</span>`;
}

function logBtnLabel(exSpec, row, isLast){
  if(row.done) return `✓ ${setLabel(exSpec,row)} — ${isLast ? 'Finish' : 'Next'}`;
  return `${row.warmup ? 'Log warm-up' : 'Log'} ${setLabel(exSpec, row)}`;
}
function doneCount(){
  return focus.exercises.reduce((n,e)=> n + sessionDraft[e.id].filter(r=>r.done).length, 0);
}

function paintFocus(){

        <div class="focus-setlabel">Set ${f.setIdx+1} of ${exSpec.sets} · exercise ${f.exIdx+1} of ${focus.exercises.length}</div>

                          aria-pressed="${!!row.warmup}">${row.warmup?'✓ Warm-up':'Warm-up'}</button>`}

function stepWeight(exSpec, delta, row){
  const inc = exSpec.inc && exSpec.inc>0 ? exSpec.inc : 1.25;
  row.weight = Math.max(0, +((parseFloat(row.weight)||0) + delta*inc).toFixed(2));
}
function stepReps(exSpec, delta, row){
  const step = exSpec.isTime ? 5 : 1;
  row.reps = Math.max(0, (parseInt(row.reps)||0) + delta*step);
}

/* Tap to nudge, press and hold to run — going 20kg -> 100kg should not mean
   64 taps or opening a keyboard with chalky hands. */
function bindStepper(btn, fn){
  if(!btn) return;
  let delay = null, rep = null, didRepeat = false;
  const stop = ()=>{ clearTimeout(delay); clearInterval(rep); delay = rep = null; };
  btn.addEventListener('click', ()=>{
    if(didRepeat){ didRepeat = false; return; }   // hold already applied the change
    fn();
  });
  btn.addEventListener('pointerdown', ()=>{
    stop();
    delay = setTimeout(()=>{
      let n = 0;
      rep = setInterval(()=>{
        didRepeat = true; fn();
        if(++n === 6){ clearInterval(rep); rep = setInterval(fn, 55); }   // accelerate
      }, 110);
    }, 450);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=> btn.addEventListener(ev, stop));
}

function attachFocusHandlers(exSpec, row){
  const isLast = focus.pos >= focus.flat.length-1;
  const edit = fn => ()=>{
    fn();
    row.touched = true;
    // changing it means re-logging it — and a rating of the old numbers is stale
    if(row.done){ row.done = false; row.effort = null; paintFocus(); return; }
    refreshLive(exSpec, row);
  };

  root.querySelector('#exitFocus')?.addEventListener('click', confirmExitFocus);
  root.querySelector('#exitFocus2')?.addEventListener('click', confirmExitFocus);
  root.querySelector('#swapEx')?.addEventListener('click', promptSwap);

  bindStepper(root.querySelector('#wMinus'), edit(()=> stepWeight(exSpec,-1,row)));
  bindStepper(root.querySelector('#wPlus'),  edit(()=> stepWeight(exSpec, 1,row)));
  bindStepper(root.querySelector('#rMinus'), edit(()=> stepReps(exSpec,-1,row)));
  bindStepper(root.querySelector('#rPlus'),  edit(()=> stepReps(exSpec, 1,row)));

  root.querySelector('#wInput')?.addEventListener('input', (e)=>{ row.weight = e.target.value; row.touched = true; refreshLive(exSpec,row); });
  root.querySelector('#rInput')?.addEventListener('input', (e)=>{ row.reps = e.target.value; row.touched = true; refreshLive(exSpec,row); });

  root.querySelector('#rest30')?.addEventListener('click', ()=>{
    focus.restEnd = Math.max(Date.now(), focus.restEnd||Date.now()) + 30000;
    focus.restLen += 30; focus.restDinged = false;
    root.querySelector('#restBand')?.classList.remove('ready');
    if(!restTimer) restTimer = setInterval(tickRest, 250);
    tickRest();
  });
  // Repaint, not just remove: skipping rest also dismisses the effort prompt
  // that was riding with it, and a stale prompt about a set two ago is worse
  // than no prompt at all. It comes back if you step back onto that set.
  root.querySelector('#restSkip')?.addEventListener('click', ()=>{ stopRest(); paintFocus(); });

  root.querySelector('#logSet')?.addEventListener('click', ()=>{
    if(row.done){ advance(); return; }              // already logged — this is just "Next"
    row.weight = parseFloat(row.weight)||0;
    row.reps = parseFloat(row.reps)||0;
    row.done = true;
    // remember which set the effort buttons are about once we've moved on
    const cell = focus.flat[focus.pos];
    focus.lastLogged = row.warmup ? null : { exId: exSpec.id, setIdx: cell.setIdx };
    buzz(18);
    if(!isLast) startRest(defaultRest(exSpec));
    advance();
  });

  root.querySelectorAll('.efbtn').forEach(b=> b.addEventListener('click', ()=>{
    const s = effortSubject();
    if(!s) return;
    const k = b.dataset.eff;
    s.row.effort = s.row.effort === k ? null : k;   // tap again to clear a mis-tap
    buzz(12);
    // repaint: a hard set caps the sets after it, an easy one can lift them,
    // and the strip and the steppers both have to show that immediately
    paintFocus();
  }));
  root.querySelector('#whyBtn')?.addEventListener('click', ()=>{ whyOpen = !whyOpen; paintFocus(); });
  root.querySelector('#warmToggle')?.addEventListener('click', ()=>{
    row.warmup = !row.warmup;
    paintFocus();
  });
  root.querySelector('#undoSet')?.addEventListener('click', ()=>{
    row.done = false; row.touched = true; row.effort = null;
    if(focus.lastLogged && focus.lastLogged.exId === exSpec.id) focus.lastLogged = null;
    stopRest();
    paintFocus();
  });
  root.querySelector('#skipSet')?.addEventListener('click', advance);
  root.querySelector('#prevSet')?.addEventListener('click', ()=>{
    if(focus.pos>0){ focus.pos--; paintFocus(); }
  });
}

// Update only what changed — repainting the whole screen would kill the rest timer
// mid-tick and drop keyboard focus while you're typing a weight.
function refreshLive(exSpec, row){
  const wInput = root.querySelector('#wInput');
  const rInput = root.querySelector('#rInput');
  if(wInput && wInput !== document.activeElement) wInput.value = row.weight;
  if(rInput && rInput !== document.activeElement) rInput.value = row.reps;
  const btn = root.querySelector('#logSet');
  if(btn) btn.textContent = logBtnLabel(exSpec, row, focus.pos >= focus.flat.length-1);
  const fn = root.querySelector('#floorNote');
  if(fn) fn.innerHTML = floorNoteHTML(exSpec, row);
  updateBarbellOnly(exSpec,row);
}
function updateBarbellOnly(exSpec, row){
  if(!usesBar(exSpec)) return;   // plate math is meaningless on a cable stack
  const bbWrap = root.querySelector('.focus-bb');
  if(bbWrap) bbWrap.innerHTML = barbellSVG(parseFloat(row.weight)||0);
}

function advance(){
  if(focus.pos < focus.flat.length-1){
    focus.pos++;
    paintFocus();
  } else {
    saveFocusSession();
  }
}

function confirmExitFocus(){
  showConfirm('End this workout now? Anything logged so far will be saved.', 'End workout', ()=> saveFocusSession(true));
}

async function saveFocusSession(early){
  focus.active = false;
  stopRest();
  keepAwake(false);
  const tKey = focus.date || todayKey();   // may be a past day being backfilled
  const prevMeta = (state.completions[tKey] && state.completions[tKey]._meta) || null;
  if(!state.completions[tKey]) state.completions[tKey] = {};
  state.completions[tKey]._meta = {
    sessionId: focus.sessionId,
    sessionName: focus.sessionName,
    // preserve any note already written for today when re-saving an edited session
    note: prevMeta && prevMeta.note ? prevMeta.note : '',
    reason: prevMeta && prevMeta.reason ? prevMeta.reason : '',
  };

  const under = [];        // exercises logged below their floor
  const raised = [];       // exercises whose floor the ratchet just moved up
  const prs = [];          // exercises that beat their best-ever estimated 1RM

  focus.exercises.forEach(exSpec=>{
    const rows = sessionDraft[exSpec.id].filter(r=> r.done);
    if(!rows.length) return;
    const cleanSets = rows.map(r=>({
      weight: parseFloat(r.weight)||0,
      reps: parseFloat(r.reps)||0,
      ...(r.warmup ? { warmup:true } : {}),
      // only written when you actually rated it — absent means unknown, and
      // every effort-aware rule is written to fall back cleanly on absent
      ...(r.effort && PROGRESSION.EFFORT_RIR[r.effort] !== undefined ? { effort:r.effort } : {}),
    }));
    // Ramp-up sets are recorded but excluded from every judgement: they must not
    // set floors, break PRs, or drag a "below your floor" warning.
    const working = cleanSets.filter(s=> !s.warmup);

    const floorBefore = floorFor(exSpec.id);
    if(!exSpec.isTime && floorBefore > 0 && working.length && working.some(s=> s.weight < floorBefore)){
      under.push({ name: exSpec.name, floor: floorBefore,
                   low: Math.min(...working.map(s=>s.weight)) });
    }

    // Judge the PR against everything except today, so re-saving an edit can't
    // compare the session against itself and lose the badge.
    if(!exSpec.isTime && working.length && isPR(exSpec.id, working, tKey)){
      prs.push({ id: exSpec.id, name: exSpec.name, e1rm: bestE1RM(working) });
    }

    if(!state.history[exSpec.id]) state.history[exSpec.id] = [];
    const hist = state.history[exSpec.id];
    // Upsert by date. Pushing blindly meant re-opening "Review today's log" filed a
    // second entry for the same day, which then skewed every future suggestion.
    const existingIdx = hist.findIndex(h=> h.date === tKey);
    if(existingIdx > -1) hist[existingIdx] = { date: tKey, sets: cleanSets };
    else hist.push({ date: tKey, sets: cleanSets });

    if(working.length && raiseFloor(exSpec, working)) raised.push(exSpec.name);
    // Record the floor you were held to at the time. The log draws its line from
    // this, not from floorFor() — otherwise today's floor would retroactively
    // mark a session from three months ago as a miss.
    state.completions[tKey][exSpec.id] = {
      name: exSpec.name, isTime: exSpec.isTime, sets: cleanSets,
      ...(floorBefore > 0 ? { floor: floorBefore } : {}),
    };
  });

  // Nothing logged at all — don't leave an empty {_meta} shell behind.
  if(!Object.keys(state.completions[tKey]).some(k=> k !== '_meta')){
    delete state.completions[tKey];
  }

  // Repeated misses on the same lift: offer a way down, once the history is written.
  focus.stalled = focus.exercises
    .filter(e=> shouldOfferDeload(e))
    .map(e=>({ id:e.id, name:e.name, floor:floorFor(e.id), to:deloadTarget(e),
               misses:consecutiveMisses(e) }));

  if(state.completions[tKey]) state.completions[tKey]._meta.prs = prs.map(p=>p.id);
  focus.under = under;
  focus.raised = raised;
  focus.prs = prs;
  invalidatePlans();          // history and floors just moved
  await saveState();
  paintFinish(early);
}

const BAD_DAY_REASONS = ['Poor sleep', 'Illness', 'Injury / pain', 'Low energy', 'Short on time', 'Deload'];

function paintFinish(early){
  const under = focus.under || [];
  const raised = focus.raised || [];
  const stalled = focus.stalled || [];
  const prs = focus.prs || [];
  const tKey = focus.date || todayKey();
  const meta = (state.completions[tKey] && state.completions[tKey]._meta) || {};

  root.innerHTML = `
    <div class="finish-screen">
      <div class="fi">✓</div>
      <h2>${early ? 'Workout saved' : 'Workout complete'}</h2>
      <p>${focus.sessionName} logged for today.</p>

      ${prs.length ? `
        <div class="finishcard pr">
          <span class="eyebrow" style="color:var(--gold);">★ Personal best</span>
          <p class="fcbody">
            ${prs.map(p=>`<b>${p.name}</b> — est. 1RM ${num(roundToPlate(p.e1rm, unitKey()))}${unitLabel()}`).join('<br>')}
          </p>
          <p class="fchint">Strongest you've ever been on ${prs.length===1?'this lift':'these lifts'}.</p>
        </div>` : ''}

      ${raised.length ? `
        <div class="finishcard raised">
          <span class="eyebrow" style="color:var(--patina);">New floor</span>
          <p class="fcbody">${raised.map(n=>`<b>${n}</b>`).join(', ')}
          ${raised.length===1?'moved':'moved'} up. That weight is your new minimum.</p>
        </div>` : ''}

      ${under.length ? `
        <div class="finishcard under">
          <span class="eyebrow" style="color:var(--danger);">Below your floor</span>
          <p class="fcbody">
            ${under.map(u=>`<b>${u.name}</b> at ${num(u.low)}${unitLabel()}, floor ${num(u.floor)}${unitLabel()}`).join('<br>')}
          </p>
          <p class="fchint">Saved as logged — your floor hasn't moved. Note why, so future you
          knows this was a rough day and not a stall.</p>
          <div class="reasons">
            ${BAD_DAY_REASONS.map(r=>`
              <button class="reason ${meta.reason===r?'on':''}" data-reason="${r}">${r}</button>`).join('')}
          </div>
          <input type="text" id="dayNote" class="daynote" maxlength="140"
                 placeholder="Anything else worth remembering?" value="${meta.note || ''}">
        </div>` : ''}

      ${stalled.length ? `
        <div class="finishcard stalled">
          <span class="eyebrow" style="color:var(--gold);">Time to deload?</span>
          <p class="fcbody">
            ${stalled.map(s=>`<b>${s.name}</b> has come in under its floor ${s.misses} sessions running.`).join('<br>')}
          </p>
          <p class="fchint">Your floor only moves down when you say so. Dropping it about
          10% gives you room to build back up.</p>
          ${stalled.map(s=>`
            <button class="btn btn-ghost deloadbtn" data-deload="${s.id}">
              ${s.name}: ${num(s.floor)}${unitLabel()} → ${num(s.to)}${unitLabel()}
            </button>`).join('')}
        </div>` : ''}

      <button class="btn btn-primary" id="doneBtn" style="max-width:280px;">Done</button>
    </div>
  `;

  root.querySelectorAll('[data-deload]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const exId = b.dataset.deload;
      const spec = focus.exercises.find(e=> e.id === exId);
      if(!spec) return;
      const to = applyDeload(spec);
      invalidatePlans();
      await saveState();
      b.disabled = true;
      b.textContent = `${spec.name}: floor now ${num(to)}${unitLabel()}`;
      b.classList.add('deloaded');
      focus.stalled = (focus.stalled || []).filter(s=> s.id !== exId);
    });
  });

  root.querySelectorAll('[data-reason]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const m = state.completions[tKey]._meta;
      m.reason = (m.reason === b.dataset.reason) ? '' : b.dataset.reason;
      root.querySelectorAll('[data-reason]').forEach(o=>
        o.classList.toggle('on', o.dataset.reason === m.reason));
    });
  });

  root.querySelector('#doneBtn')?.addEventListener('click', async ()=>{
    const noteEl = root.querySelector('#dayNote');
    if(noteEl) state.completions[tKey]._meta.note = noteEl.value.trim();
    await saveState();
    renderHome();
  });
}

/* ============================= PLAN =============================
   A full editor for the routine, held entirely in a draft. Nothing here touches
   saved state until Save is pressed — you can rename, add, delete, reorder and
   change your mind freely, and Discard puts it all back. */
let planDraft = null;

function planDraftFromState(){
  const sessions = planSessions().map(s=>({ id:s.id, name:s.name }));
  const exercises = {};
  sessions.forEach(s=>{ exercises[s.id] = JSON.parse(JSON.stringify(exercisesFor(s.id))); });
  return {
    routineName: routineName(),
    unit: unitKey(),
    dayMap: { ...(state.setup ? state.setup.dayMap : {}) },
    sessions, exercises,
    floors: { ...state.floors },
    openEx: null,
    dirty: false,
  };
}
function planDirty(){ if(planDraft) planDraft.dirty = true; }

function planHasChanges(){
  if(!planDraft) return false;
  return planDraft.dirty;
}

function renderPlan(){
  if(!state.setup) return renderWizard();      // first run still uses the wizard
  if(!planDraft) planDraft = planDraftFromState();
  const d = planDraft;

      </div>
      <div class="plan-list">
        ${d.exercises[s.id].length

          : '<p class="emptyplan">No exercises yet.</p>'}
      </div>
      <button class="btn btn-ghost addex" data-addex="${s.id}">+ Add exercise</button>
    </div>`).join('');

  const weighted = [];
  d.sessions.forEach(s=> d.exercises[s.id].forEach(e=>{ if(!e.isTime) weighted.push(e); }));

  root.innerHTML = `
    <header class="top">
      ${brandHTML("PLAN")}
      ${d.dirty ? '<button class="reset" id="planDiscard">Discard</button>' : ''}
    </header>
    <main>
      ${d.dirty ? '<div class="unsaved">Unsaved changes</div>' : ''}

      <div class="card">
        <span class="eyebrow">Routine name</span>

               style="margin-top:8px;" aria-label="Routine name">
        <div class="unitrow">
          <span class="ellabel">Weights in</span>
