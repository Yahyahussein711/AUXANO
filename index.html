            <button data-punit="kg" class="${d.unit==='kg'?'on':''}" aria-pressed="${d.unit==='kg'}">Kilograms</button>
            <button data-punit="lb" class="${d.unit==='lb'?'on':''}" aria-pressed="${d.unit==='lb'}">Pounds</button>
          </div>
        </div>
      </div>

      <div class="card">
        <span class="eyebrow">Training days</span>
        <p class="fchint" style="margin:6px 0 0;">Tap a day to train it, then choose which session it runs.</p>
        <div class="daygrid" style="margin-top:12px;">
          ${DAYS.map(dd=>`
            <div class="daychip ${d.dayMap[dd.k]?'active':''}" data-pday="${dd.k}"
                 role="button" tabindex="0" aria-pressed="${!!d.dayMap[dd.k]}"
                 aria-label="${dd.full}">${dd.label}</div>`).join('')}
        </div>
        ${sortedDays.length ? `
          <div style="margin-top:14px;">
            ${sortedDays.map(k=>`
              <div class="maprow">
                <div class="dname">${DAYS.find(x=>x.k===k).full}</div>
                <select data-pmap="${k}">
                  ${d.sessions.map(s=>`<option value="${s.id}" ${s.id===d.dayMap[k]?'selected':''}>${s.name||'Untitled'}</option>`).join('')}
                </select>
              </div>`).join('')}
          </div>`
          : '<p class="emptyplan">No training days selected.</p>'}
      </div>

      <span class="eyebrow" style="display:block; margin:20px 0 8px 2px;">Sessions</span>
      ${sessionCards}
      <button class="btn btn-ghost" id="addSess" style="margin-top:4px;">+ Add session</button>

      ${weighted.length ? `
        <span class="eyebrow" style="display:block; margin:22px 0 8px 2px;">Starting weights</span>
        <p class="fchint" style="margin:0 0 10px 2px;">
          Each lift's floor — the weight Auxano won't suggest going under. Blank means
          it's set from your next logged session.
        </p>
        <div class="plan-list">
          ${weighted.map(e=>`
            <div class="baserow">
              <div class="basename">${e.name}<span class="basespec">${exSummary(e)}</span></div>
              <div class="baseinput">
                <input type="number" inputmode="decimal" min="0" step="0.5"
                       data-pfloor="${e.id}" placeholder="—"
                       aria-label="Floor for ${e.name}"
                       value="${d.floors[e.id] > 0 ? d.floors[e.id] : ''}">
                <span class="baseunit">${UNITS[d.unit].label}</span>
              </div>
            </div>`).join('')}
        </div>` : ''}

      <div class="stickybar" style="display:flex; gap:10px;">
        <button class="btn btn-primary" id="planSave" ${d.dirty?'':'disabled'}>
          ${d.dirty ? 'Save plan' : 'Saved'}
        </button>
      </div>
    </main>
    ${tabbarHTML('plan')}
  `;

  bindPlanPage();
  bindTabs();
}

function bindPlanPage(){
  const d = planDraft;

  root.querySelector('#planName')?.addEventListener('input', (e)=>{
    d.routineName = e.target.value; planDirty(); markPlanDirty();
  });

  root.querySelectorAll('[data-punit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const next = b.dataset.punit;
      if(next === d.unit) return;
      // Convert the draft's own numbers now; stored history is converted on Save.
      const conv = v => convertWeight(v, d.unit, next);
      const steps = UNITS[next].steps;
      const nearest = v => steps.reduce((bst,x)=> Math.abs(x-v) < Math.abs(bst-v) ? x : bst, steps[0]);
      Object.keys(d.floors).forEach(k=>{ d.floors[k] = conv(d.floors[k]); });
      Object.keys(d.exercises).forEach(sid=> d.exercises[sid].forEach(e=>{
        if(e.inc) e.inc = nearest(conv(e.inc));
      }));
      d.unit = next; planDirty(); renderPlan();
    });
  });

  root.querySelectorAll('[data-pday]').forEach(el=>{
    const toggle = ()=>{
      const k = el.dataset.pday;
      if(d.dayMap[k]) delete d.dayMap[k];
      else d.dayMap[k] = d.sessions[0] ? d.sessions[0].id : null;
      if(d.dayMap[k] === null) delete d.dayMap[k];
      planDirty(); renderPlan();
    };
    el.addEventListener('click', toggle);
    el.addEventListener('keydown', ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); toggle(); } });
  });

  root.querySelectorAll('[data-pmap]').forEach(sel=>{
    sel.addEventListener('change', ()=>{ d.dayMap[sel.dataset.pmap] = sel.value; planDirty(); markPlanDirty(); });
  });

  root.querySelectorAll('[data-sessname]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const s = d.sessions.find(x=> x.id === inp.dataset.sessname);
      if(s){ s.name = inp.value; planDirty(); markPlanDirty(); }
    });
  });

  root.querySelectorAll('[data-delsess]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.delsess;
      const s = d.sessions.find(x=> x.id === id);
      const drop = ()=>{
        d.sessions = d.sessions.filter(x=> x.id !== id);
        delete d.exercises[id];
        Object.keys(d.dayMap).forEach(k=>{
          if(d.dayMap[k] === id) d.dayMap[k] = d.sessions[0] ? d.sessions[0].id : undefined;
          if(!d.dayMap[k]) delete d.dayMap[k];
        });
        d.openEx = null; planDirty(); renderPlan();
      };
      if((d.exercises[id] || []).length){
        showConfirm(`Delete <b>${s ? s.name : 'this session'}</b> and its ${d.exercises[id].length} exercises?<br><br>Nothing is saved until you press Save.`,
          'Delete', drop, { danger:true });
      } else drop();
    });
  });

  root.querySelector('#addSess')?.addEventListener('click', ()=>{
    const s = newCustomSession(d.sessions.length);
    s.name = 'Session ' + (d.sessions.length + 1);
    d.sessions.push(s);
    d.exercises[s.id] = [];
    planDirty(); renderPlan();
  });

  root.querySelectorAll('[data-addex]').forEach(b=>{
    b.addEventListener('click', ()=> promptAddExercise(b.dataset.addex));
  });
  root.querySelectorAll('.planrow[data-row]').forEach(el=> bindPlanRow(el.dataset.row));

  root.querySelectorAll('[data-pfloor]').forEach(inp=>{
    const commit = ()=>{
      const v = parseFloat(inp.value);
      if(isFinite(v) && v > 0) d.floors[inp.dataset.pfloor] = v;
      else delete d.floors[inp.dataset.pfloor];
      planDirty(); markPlanDirty();
    };
    inp.addEventListener('input', commit);
    inp.addEventListener('change', commit);
  });

  root.querySelector('#planDiscard')?.addEventListener('click', ()=>{
    showConfirm('Throw away your unsaved changes?', 'Discard', ()=>{
      planDraft = null; renderPlan();
    }, { danger:true });
  });

  root.querySelector('#planSave')?.addEventListener('click', savePlan);
}

// Light-touch dirty marker so typing doesn't trigger a full re-render mid-keystroke.
function markPlanDirty(){
  const btn = root.querySelector('#planSave');
  if(btn){ btn.disabled = false; btn.textContent = 'Save plan'; }
  if(!root.querySelector('.unsaved')){
    const m = root.querySelector('main');
    if(m) m.insertAdjacentHTML('afterbegin', '<div class="unsaved">Unsaved changes</div>');
    const h = root.querySelector('header.top');
    if(h && !root.querySelector('#planDiscard')){
      h.insertAdjacentHTML('beforeend', '<button class="reset" id="planDiscard">Discard</button>');
      root.querySelector('#planDiscard').addEventListener('click', ()=>{
        showConfirm('Throw away your unsaved changes?', 'Discard', ()=>{
          planDraft = null; renderPlan();
        }, { danger:true });
      });
    }
  }
}

async function savePlan(){
  const d = planDraft;
  const named = d.sessions.filter(s=> s.name.trim());
  if(!named.length) return planError('Give at least one session a name.');
  if(!Object.keys(d.dayMap).length) return planError('Pick at least one training day.');

  const next = normalizeSetup({
    templateId: state.setup ? state.setup.templateId : 'custom',
    routineName: d.routineName.trim() || 'My routine',
    sessions: named.map(s=>({ id:s.id, name:s.name.trim() })),
    dayMap: d.dayMap,
    exercises: d.exercises,
  });
  if(!next) return planError("That plan can't be saved — every session needs at least one exercise.");

  // Unit change converts everything already recorded; the draft is already in
  // the new unit, so it is applied first and then overwritten by the draft.
  if(d.unit !== unitKey()) await setUnit(d.unit);

  state.setup = next;
  state.floors = { ...d.floors };
  invalidatePlans();          // sets, reps, increments and floors may all have moved
  await saveState();
  planDraft = null;
  renderPlan();
  const btn = root.querySelector('#planSave');
  if(btn) btn.textContent = 'Saved';
}

function planError(msg){
  showConfirm(msg, 'OK', ()=>{});
}

/* ============================= EXERCISE PROGRESS =============================
   The payoff for logging: one lift, its trend, and what it would take to beat. */
function findExSpec(exId){
  for(const s of planSessions()){
    const hit = exercisesFor(s.id).find(e=> e.id === exId);
    if(hit) return hit;
  }
  return null;
}

/* What the engine will ask for next time, on the screen you open to think
   about this lift rather than to perform it. The gym card is deliberately
   terse; here there is room to say what the trend is doing and how much the
   engine trusts its own answer. */
const TREND_WORD = { up:'trending up', flat:'holding flat', down:'trending down' };
function nextUpHTML(spec){
  if(!spec) return '';                      // history for a lift no longer in the plan
  const p = planFor(spec);
  if(p.rule === 'unknown') return '';
  const unit = spec.isTime ? 's' : unitLabel();
  const dir = p.trend && p.trend.dir;
  return `
    <div class="card" style="margin-top:14px;">
      <div class="cardhead">
        <span class="eyebrow" style="margin:0;">Next session</span>
        ${dir ? `<span class="cardmeta ${dir === 'up' ? 'up' : (dir === 'down' ? 'down' : '')}">${TREND_WORD[dir]}</span>` : ''}
      </div>
      <div class="nextrow">
        <span class="nexthead">${p.headline}</span>
        ${p.weight === null || p.weight === undefined ? '' : `<span class="nextval">${
          spec.isTime ? `${p.targets[0].reps}<em>${unit}</em>`
                      : `${num(p.weight)}<em>${unit}</em> × ${p.targets.map(t=>t.reps).join('/')}`
        }</span>`}
      </div>
      <p class="fchint" style="margin-top:8px;">${p.detail}</p>
      <span class="conf conf-${p.confidence}">Confidence: ${p.confidence}${
        p.confidenceWhy ? ` — ${p.confidenceWhy}` : ''}</span>
    </div>`;
}

function renderExercise(exId, backTo){
  const spec = findExSpec(exId);
  const hist = getHistory(exId).slice().sort((a,b)=> a.date < b.date ? -1 : 1);
  const name = (spec && spec.name) ||
    (hist.length && (Object.values(state.completions).map(c=>c[exId]).find(Boolean)||{}).name) || 'Exercise';

  const e1 = hist.map(h=> bestE1RM(h.sets)).filter(v=> v > 0);
  const tops = hist.map(h=> topWeightOf(h.sets));
  const bestE = e1.length ? Math.max(...e1) : 0;
  const bestW = tops.length ? Math.max(...tops) : 0;
  const first = e1.length ? e1[0] : 0;
  const latest = e1.length ? e1[e1.length-1] : 0;
  const gain = first > 0 ? ((latest - first) / first) * 100 : 0;
  const floor = floorFor(exId);
  const totalSets = hist.reduce((n,h)=> n + h.sets.length, 0);
  const volume = hist.reduce((n,h)=> n + h.sets.reduce((m,s)=> m + (s.weight||0)*(s.reps||0), 0), 0);

  /* The floor chart lives here rather than in the log: one lift, one session,
     a screen you opened on purpose and where there is room for it. */
  const lastEntry = hist.length ? hist[hist.length-1] : null;
  const lastCompletion = lastEntry
    ? (state.completions[lastEntry.date] || {})[exId] || null
    : null;
  const lastChart = lastEntry ? setChartHTML({
    isTime: !!(spec && spec.isTime),
    sets: lastEntry.sets,
    floor: lastCompletion && lastCompletion.floor,
  }) : null;
  const lastLabel = lastEntry
    ? new Date(lastEntry.date + 'T00:00:00').toLocaleDateString(undefined,{ weekday:'short', day:'numeric', month:'short' })
    : '';

  const rows = hist.slice().reverse().map(h=>{
    const pr = bestE1RM(h.sets) >= bestE - 0.01 && bestE > 0;
    const d = new Date(h.date + 'T00:00:00');
    return `
      <div class="exline">
        <span class="exlname">
          ${d.toLocaleDateString(undefined,{ weekday:'short', day:'numeric', month:'short' })}
          ${pr ? '<span class="pr-badge">★ Best</span>' : ''}
        </span>
        <span class="setline">${loggedSpecCaps({ isTime: spec && spec.isTime, sets: h.sets })}</span>
      </div>`;
  }).join('');

  root.innerHTML = `
    <header class="top">
      <button class="exit-btn" id="exBack" aria-label="Back">←</button>
      <div class="brand" style="font-size:14px;">PROGRESS</div>
      <div style="width:44px;"></div>
    </header>
    <main>
      <div class="hero">
        <span class="eyebrow">${routineName()}</span>
        <h2 class="heroname">${name}</h2>
        <p class="herometa">${hist.length} session${hist.length===1?'':'s'} · ${totalSets} sets logged</p>

        ${e1.length > 1 ? `
          <div class="chartwrap">
            ${sparkline(e1, 300, 84)}
            <div class="chartaxis">
              <span>${num(roundToPlate(Math.min(...e1), unitKey()))}${unitLabel()}</span>
              <span>Estimated 1RM</span>
              <span>${num(roundToPlate(Math.max(...e1), unitKey()))}${unitLabel()}</span>
            </div>
          </div>` : `
          <p class="fchint" style="margin-top:14px;">
            ${hist.length ? 'One session so far — the trend appears once you log another.'
                          : 'Nothing logged for this lift yet.'}
          </p>`}
      </div>

      <div class="statrow" style="margin-top:14px;">
        <div class="statcard"><div class="statnum">${bestW ? num(bestW) : '—'}</div><div class="statlabel">Best ${unitLabel()}</div></div>
        <div class="statcard"><div class="statnum">${bestE ? num(roundToPlate(bestE, unitKey())) : '—'}</div><div class="statlabel">Est. 1RM</div></div>
        <div class="statcard"><div class="statnum">${floor ? num(floor) : '—'}</div><div class="statlabel">Floor</div></div>
      </div>

      ${nextUpHTML(spec)}

      ${lastChart ? `
        <div class="card" style="margin-top:14px;">
          <div class="cardhead">
            <span class="eyebrow" style="margin:0;">Last session</span>
            <span class="cardmeta">${lastLabel}</span>
          </div>
          <div class="bigchart">${lastChart}</div>
        </div>` : ''}

      ${e1.length > 1 ? `
        <div class="card" style="margin-top:14px;">
          <div class="cardhead">
            <span class="eyebrow" style="margin:0;">Since you started</span>
            <span class="cardmeta ${gain >= 0 ? 'up':'down'}">${gain >= 0 ? '+' : ''}${gain.toFixed(1)}%</span>
          </div>
          <p class="fchint" style="margin-top:6px;">
            Estimated 1RM went from ${num(roundToPlate(first, unitKey()))}${unitLabel()}
            to ${num(roundToPlate(latest, unitKey()))}${unitLabel()}.
            Total volume lifted: ${num(Math.round(volume))}${unitLabel()}.
          </p>
        </div>` : ''}

      ${hist.length ? `
        <div style="margin-top:16px;">
          <span class="eyebrow" style="display:block; margin:4px 0 6px 2px;">Every session</span>

  root.querySelector('#exBack')?.addEventListener('click', ()=>{

}

/* ============================= BACKUP =============================
   The whole point is surviving this browser. Export writes a plain JSON file you
   can keep anywhere; import replaces what's here after an explicit confirmation. */
const BACKUP_VERSION = 1;

function backupPayload(){
  return JSON.stringify({
    app: 'auxano',
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    state: { setup:state.setup, history:state.history, completions:state.completions,
             floors:state.floors, settings:state.settings },
  }, null, 2);
}

function backupStat(msg, bad){
  const el = root.querySelector('#backupStat');
  if(!el) return;
  el.textContent = msg;
  el.className = 'backupstat' + (bad ? ' bad' : ' good');
}

function exportBackup(){
  try{
    const blob = new Blob([backupPayload()], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `auxano-${todayKey()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
    const n = Object.keys(state.completions).filter(hasLoggedDay).length;
    backupStat(`Exported ${n} session${n===1?'':'s'}.`);
  }catch(e){
    backupStat('Export failed — your browser blocked the download.', true);
  }
}

function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = ()=> backupStat("Couldn't read that file.", true);
  reader.onload = ()=>{
    let parsed = null;
    try{ parsed = JSON.parse(String(reader.result)); }
    catch(e){ return backupStat("That isn't a valid backup file.", true); }
    if(!parsed || parsed.app !== 'auxano' || !parsed.state){
      return backupStat("That doesn't look like an Auxano backup.", true);
    }
    // Run it through the same validation as a normal load, so a hand-edited or
    // older file can't put the app into a state it can't render.
    const incoming = normalizeState(parsed.state);
    const sessions = Object.keys(incoming.completions).filter(dk=>{
      const d = incoming.completions[dk];
      return !!d && Object.keys(d).some(k=>k!=='_meta');
    }).length;

    showConfirm(
      `Replace everything with this backup?<br><br>` +
      `It holds <b>${sessions}</b> logged session${sessions===1?'':'s'}` +
      `${incoming.setup ? ` and the <b>${incoming.setup.routineName}</b> routine` : ''}.<br><br>` +
      `Your current data is overwritten. This can't be undone.`,
      'Replace',
      async ()=>{
        const dev = state.dev;            // keep the test panel where it was
        state = incoming;
        state.dev = dev;
        await saveState();
        renderHistory();
        backupStat(`Imported ${sessions} session${sessions===1?'':'s'}.`);
      },
      { danger:true }
    );
  };
  reader.readAsText(file);
}

/* ---------- Swapping an exercise mid-session ---------- */
function promptSwap(){
  const { f, exSpec } = currentCell();
  const options = [];
  planSessions().forEach(s=>{
    exercisesFor(s.id).forEach(e=>{
      if(e.id !== exSpec.id && !options.some(o=>o.name===e.name)) options.push(e);
    });
  });
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="swTitle">
      <p id="swTitle" style="margin-bottom:6px;">Swap ${exSpec.name}</p>
      <p class="fchint" style="margin:0 0 14px;">
        Rack taken or something hurting? Pick a replacement for today only —
        your routine stays as it is.
      </p>
      <select id="swPick" style="width:100%; margin-bottom:18px;">
        ${options.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}
      </select>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="swCancel">Cancel</button>
        <button class="btn btn-primary" id="swGo" ${options.length?'':'disabled'}>Swap</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#swCancel').addEventListener('click', close);
  overlay.querySelector('#swGo').addEventListener('click', ()=>{
    const pick = options.find(o=> o.id === overlay.querySelector('#swPick').value);
    close();
    if(!pick) return;
    // Keep the prescribed sets/reps of the slot being filled; take the new lift's
    // identity, increment and equipment so progression and plate math stay right.
    const replacement = { ...pick, sets: exSpec.sets, repMin: exSpec.repMin, repMax: exSpec.repMax };
    focus.exercises[f.exIdx] = replacement;
    delete sessionDraft[exSpec.id];
    sessionDraft[replacement.id] = Array.from({length: replacement.sets},
      ()=>({ weight:null, reps:null, done:false, touched:false, warmup:false }));
    focus.flat = [];
    focus.exercises.forEach((e,exIdx)=>{
      for(let i=0;i<sessionDraft[e.id].length;i++) focus.flat.push({exIdx, setIdx:i});
    });
    focus.pos = focus.flat.findIndex(x=> x.exIdx === f.exIdx);
    paintFocus();
  });
}

/* ============================= HISTORY / TRAINING LOG ============================= */
const LOG_PREVIEW = 3;      // sessions shown before "show older"
let logExpanded = false;    // resets whenever you leave the screen
function computeStreak(){
  let streak = 0;
  let d = nowDate();
  for(let i=0;i<400;i++){
    const wk = weekdayKey(d);
    const dk = dateKey(d);
    const scheduled = !!state.setup.dayMap[wk];
    if(scheduled){
      if(hasLoggedDay(dk)) streak++;
      else if(dk !== todayKey()) break; // today not done yet doesn't break the streak
    }
    d = addDays(d, -1);
  }
  return streak;
}

// One source of truth for "what does this week look like" — Home and the log both use it.
function weekCells(ref){
  const monday = weekStart(ref || nowDate());
  const tKey = todayKey();
  return DAY_ORDER.map((wk,i)=>{
    const d = addDays(monday, i);
    const dk = dateKey(d);
    const sessionId = state.setup.dayMap[wk];
    const done = hasLoggedDay(dk);
    let status = 'rest';
    if(done) status = 'done';
    else if(sessionId && dk < tKey) status = 'missed';
    else if(sessionId) status = 'scheduled';
    return { wk, date:d, dk, dayNum:d.getDate(), label:DAYS[i].label, sessionId, status, isToday: dk===tKey };
  });
}

function computeStats(){
  const totalSessions = Object.keys(state.completions).filter(hasLoggedDay).length;
  const week = weekCells();
  return {
    totalSessions,
    scheduledThisWeek: week.filter(c=>c.sessionId).length,
    doneThisWeek: week.filter(c=>c.sessionId && c.status==='done').length,
    streak: computeStreak(),
  };
}

// Four Monday-aligned weeks ending with the current one, so every column really is
// the same weekday. The old version started at today-27 and only lined up on Sundays.
function buildHeatmap(){
  const start = addDays(weekStart(nowDate()), -21);
  const tKey = todayKey();
  const cells = [];
  for(let i=0;i<28;i++){
    const d = addDays(start, i);
    const dk = dateKey(d);
    const scheduled = !!state.setup.dayMap[weekdayKey(d)];
    let status = 'blank';
    if(hasLoggedDay(dk)) status = 'done';
    else if(scheduled && dk < tKey) status = 'missed';
    else if(scheduled) status = 'scheduled';
    cells.push({ dk, dayNum:d.getDate(), status, isToday: dk===tKey, future: dk > tKey });
  }
  return cells;
}

function renderHistory(){
  const stats = computeStats();
  const cells = buildHeatmap();
  const dateKeys = Object.keys(state.completions).filter(hasLoggedDay).sort().reverse();

  const heatmapHTML = cells.map(c=>
    `<div class="hcell ${c.status} ${c.isToday?'istoday':''} ${c.future?'future':''}" title="${c.dk}">${c.dayNum}</div>`
  ).join('');

  // Only the last few sessions by default — the log grows forever and the
  // heatmap above already covers the longer view.
  const shown = logExpanded ? dateKeys : dateKeys.slice(0, LOG_PREVIEW);
  const hidden = dateKeys.length - shown.length;

  const listHTML = dateKeys.length ? shown.map(dk=>{
    const entry = state.completions[dk];
    const meta = entry._meta || { sessionName:'Workout' };
    const exIds = Object.keys(entry).filter(k=>k!=='_meta');
    const d = new Date(dk+'T00:00:00');
    const dateLabel = d.toLocaleDateString(undefined,{ weekday:'short', month:'short', day:'numeric' });
    const exHTML = exIds.map(exId=>{
      const e = entry[exId];
      const pr = meta.prs && meta.prs.indexOf(exId) > -1;
      const weighted = (e.sets || []).some(s => (+s.weight || 0) > 0);
      return `
        <button class="exline tappable compact" data-exprog="${exId}">
          <span class="exlname">
            <span class="nm">${e.name}${pr ? '<span class="pr-badge">★ PR</span>' : ''}</span>
            <span class="exunit">${e.isTime ? 'sec' : (weighted ? unitLabel() : 'reps')}</span>
          </span>
          <span class="setline">${loggedSpecCaps(e)}</span>
        </button>`;
    }).join('');
    const flag = (meta.reason || meta.note) ? `
      <div class="dayflag">
        ${meta.reason ? `<span class="reasontag">${meta.reason}</span>` : ''}
        ${meta.note ? `<span class="reasonnote">${meta.note}</span>` : ''}
      </div>` : '';
    return `
      <div class="card logday">
        <span class="eyebrow">${dateLabel}</span>
        <h3 class="logname">${meta.sessionName}</h3>
        ${flag}
        <div class="exlist">${exHTML}</div>
      </div>
    `;
  }).join('') : `<div class="empty"><div class="plateicon">◐</div>No workouts logged yet.</div>`;

  root.innerHTML = `
    <header class="top">
      ${brandHTML("TRAINING LOG")}
    </header>
    <main>
      <div class="statrow">
        <div class="statcard"><div class="statnum">${stats.totalSessions}</div><div class="statlabel">Sessions</div></div>
        <div class="statcard"><div class="statnum">${stats.streak}</div><div class="statlabel">Streak</div></div>
        <div class="statcard"><div class="statnum">${stats.doneThisWeek}/${stats.scheduledThisWeek}</div><div class="statlabel">This week</div></div>
      </div>
      <div class="card">
        <span class="eyebrow">Last four weeks</span>
        <div class="heatgrid heathead">${DAYS.map(d=>`<div class="hlabel">${d.label}</div>`).join('')}</div>
        <div class="heatgrid">${heatmapHTML}</div>
        <div class="heatlegend">
          <span><i class="lg done"></i>Trained</span>
          <span><i class="lg missed"></i>Missed</span>
          <span><i class="lg scheduled"></i>Upcoming</span>
        </div>
      </div>
      <div>
        <div class="cardhead" id="logSectHead" style="margin:4px 2px 10px;">
          <span class="eyebrow" style="margin:0;">${logExpanded ? 'All sessions' : 'Recent sessions'}</span>
          ${dateKeys.length ? `<span class="cardmeta">${shown.length} of ${dateKeys.length}</span>` : ''}
        </div>
        ${listHTML}
        ${hidden > 0 ? `
          <button class="btn btn-ghost showmore" id="logMore">
            Show ${hidden} older session${hidden===1?'':'s'}
          </button>` : ''}
        ${logExpanded && dateKeys.length > LOG_PREVIEW ? `
          <button class="btn btn-ghost showmore" id="logLess">Show fewer</button>` : ''}
      </div>
      <div class="backfillzone">
        <button class="btn btn-ghost" id="backfillBtn">Log a past session</button>
        <p class="backuphint">Forgot to log a day? Add it with the date it happened.</p>
      </div>

      <div class="backupzone">
        <span class="eyebrow">Backup</span>
        <p class="backuphint">
          Everything lives in this browser only. Clear your site data or switch
          browsers and it's gone — keep a copy.
        </p>
        <div class="backuprow">
          <button class="btn btn-ghost" id="exportBtn">Export</button>
          <button class="btn btn-ghost" id="importBtn">Import</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <p class="backupstat" id="backupStat"></p>
      </div>
      ${dateKeys.length ? `
        <div class="dangerzone">
          <button class="btn btn-danger" id="clearLog">Erase training log</button>
          <p class="dangerhint">
            Removes all ${dateKeys.length} logged session${dateKeys.length===1?'':'s'}.
            Your routine and your strength floors stay as they are.
          </p>
        </div>` : ''}
    </main>
    ${tabbarHTML('log')}
  `;

  root.querySelectorAll('[data-exprog]').forEach(b=>
    b.addEventListener('click', ()=> renderExercise(b.dataset.exprog, 'log')));

  root.querySelector('#logMore')?.addEventListener('click', ()=>{ logExpanded = true;  renderHistory(); });
  root.querySelector('#logLess')?.addEventListener('click', ()=>{ logExpanded = false; renderHistory(); });

  root.querySelector('#backfillBtn')?.addEventListener('click', promptBackfill);
  root.querySelector('#exportBtn')?.addEventListener('click', exportBackup);
  root.querySelector('#importBtn')?.addEventListener('click', ()=> root.querySelector('#importFile')?.click());
  root.querySelector('#importFile')?.addEventListener('change', (e)=> importBackup(e.target.files && e.target.files[0]));

  root.querySelector('#clearLog')?.addEventListener('click', ()=>{
    showConfirm(
      `Erase all ${dateKeys.length} logged session${dateKeys.length===1?'':'s'}?<br><br>` +
      `Your routine, sets and reps, and your strength floors are kept — ` +
      `only the log is cleared. This can't be undone.`,
      'Erase log',
      async ()=>{
        state.completions = {};
        state.history = {};
        invalidatePlans();
        await saveState();
        renderHistory();
      },
      { danger:true }
    );
  });
  bindTabs();
}

/* ============================= INIT ============================= */
(async function init(){
  root.innerHTML = `<div class="empty"><div class="plateicon">◐</div>Loading Auxano…</div>`;
  await loadState();
  installIcons();
  paintDevBar();
  render();
})();
</script>
</body>
</html>
