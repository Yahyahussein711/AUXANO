<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<!-- Added to the home screen, this should open as an app rather than a tab. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auxano">
<meta name="color-scheme" content="dark">
<title>Auxano — Progressive Overload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* True black — on OLED these pixels are switched off, not lit dark grey.
       Surfaces step up in near-black rather than grey so the depth stays subtle. */
    --bg:#000000;
    --panel:#0B0B0C;
    --panel-raised:#151517;
    --line:#242427;
    --hairline:rgba(255,255,255,0.055);

    --chalk:#F3F1EB;
    --chalk-dim:#A9A69E;
    --steel:#8A877E;            /* small uppercase labels — must clear AA on --panel-raised */

    /* Deeper and less saturated than a bright yellow — gold reads as precious in
       proportion to how little of it there is, so it is spent in few places. */
    --gold:#C9A227;
    --gold-bright:#F0D98C;
    --gold-deep:#B8941F;
    --gold-press:#B08D28;       /* pressed state of a gold fill */
    --gold-dim:#9C8438;
    --gold-wash:rgba(201,162,39,0.09);
    --on-gold:#100D02;          /* text that sits on a gold fill */

    --patina:#6B9C6E;           /* completed */
    --danger:#C1443A;           /* missed / destructive */
    --danger-dim:#6E2925;

    --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;          /* mobile Safari's collapsing chrome breaks plain vh */
    display:flex;
    flex-direction:column;
  }
  h1,h2,h3{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font-family:'Inter',sans-serif; cursor:pointer; border:none; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }
  input{
    font-family:'IBM Plex Mono',monospace;
    background:var(--panel-raised);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:8px;
    padding:10px 8px;
    font-size:16px;
    width:100%;
  }
  input::placeholder{ color:#5C5D62; }

  /* ---------- Header ---------- */
  header.top{
    padding:22px 20px 16px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{
    font-size:22px; font-weight:700; letter-spacing:0.06em;
    display:flex; align-items:center; gap:8px;
  }
  .logomark{ color:var(--gold); flex-shrink:0; display:block; }
  header.top .reset{
    background:none; color:var(--steel); font-size:12px; text-decoration:underline;
    text-transform:uppercase; letter-spacing:0.05em;
  }

  main{ flex:1; padding:20px; display:flex; flex-direction:column; gap:18px; }

  /* ---------- Generic cards ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
  }
  .muted{ color:var(--steel); font-size:14px; line-height:1.5; }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--gold); margin-bottom:6px; display:block;
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 20px; border-radius:10px; font-weight:600; font-size:15px;
    width:100%;
  }
  /* Flat and deeper, with one lit top edge and no outer glow — a bright
     gradient plus a drop shadow reads high-visibility, not premium. */
  .btn-primary{
    background:var(--gold); color:var(--on-gold);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.16);
  }
  .btn-primary:active{ background:var(--gold-press); box-shadow:none; }
  .btn-ghost{ background:var(--panel-raised); color:var(--chalk); border:1px solid var(--line); }
  /* Destructive actions never borrow the gold — gold means "go". */
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger-dim); }
  .btn-danger:active{ background:var(--danger); color:#fff; border-color:var(--danger); }
  .btn-text{ background:none; color:var(--steel); font-size:13px; padding:8px; width:auto; }

  /* ---------- Day picker ---------- */
  .daygrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin:14px 0 4px; }
  .daychip{
    aspect-ratio:1; border-radius:10px; background:var(--panel-raised);
    border:1px solid var(--line); color:var(--steel);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600;
  }
  .daychip.active{ background:var(--gold); border-color:var(--gold); color:var(--on-gold); }

  /* ---------- Template list ---------- */
  .tpl{
    border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:10px;
    background:var(--panel-raised); text-align:left; width:100%; color:var(--chalk);
  }
  .tpl.selected{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .tpl .tname{ font-family:'Oswald',sans-serif; font-size:17px; letter-spacing:0.02em; }
  .tpl .tfreq{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); margin:4px 0 6px; text-transform:uppercase; }
  .tpl .tdesc{ font-size:13px; color:var(--steel); line-height:1.45; }
  .tag{
    display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px;
    background:rgba(107,156,110,0.15); color:var(--patina); margin-left:8px;
    text-transform:uppercase; letter-spacing:0.05em; font-family:'IBM Plex Mono',monospace;
  }

  /* ---------- Day-session mapping ---------- */
  .maprow{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .maprow:last-child{ border-bottom:none; }
  .maprow .dname{ font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:0.03em; width:90px; }
  select{
    background:var(--panel-raised); color:var(--chalk); border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; font-family:'Inter',sans-serif; font-size:14px; flex:1;
  }

  /* ---------- Plan review (setup step 4) ---------- */
  .plan-session{ margin-bottom:16px; }
  .plan-session h3{ font-size:15px; margin-bottom:8px; color:var(--gold); }
  .emptyplan{ padding:16px; font-size:13px; color:var(--steel); text-align:center; }
  .unsaved{
    background:var(--gold-wash); border:1px solid var(--gold-dim); border-radius:9px;
    padding:9px 12px; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    letter-spacing:0.12em; text-transform:uppercase; color:var(--gold);
  }
  .sessedit{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .sessname{
    flex:1; min-width:0; font-family:'Oswald',sans-serif; font-size:16px;
    letter-spacing:0.03em; text-transform:uppercase; padding:9px 11px;
  }
  .rowactions{ display:flex; justify-content:flex-end; padding:8px 0 0; border-top:1px solid var(--line); margin-top:10px; }
  .addex{ margin-top:8px; font-size:13.5px; padding:10px; }
  .plan-list{
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden;
  }
  .planrow{ border-bottom:1px solid var(--line); }
  .planrow:last-child{ border-bottom:none; }
  .planrow-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; background:none; color:var(--chalk); text-align:left;
    padding:15px 16px; font-size:14.5px; font-weight:500;
  }
  .planrow-head .pr-name{ flex:1; min-width:0; line-height:1.3; }
  .planrow-head .pr-num{
    font-size:13.5px; display:flex; align-items:baseline; gap:9px;
  }
  .planrow-head .chev{ font-size:10px; color:var(--steel); display:inline-block; }
  .planrow{ border-bottom:1px solid var(--hairline); }
  .planrow.open .planrow-head{ background:var(--panel-raised); }
  .planrow.open .chev{ transform:rotate(90deg); color:var(--gold); }

  .planedit{ background:var(--panel-raised); padding:0 16px 14px; }
  .editline{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 0; border-top:1px solid var(--line);
  }
  .editline.stacked{ flex-direction:column; align-items:stretch; gap:10px; }
  .ellabel{
    font-size:10.5px; color:var(--steel); text-transform:uppercase; letter-spacing:0.08em;
  }
  .mini{ display:flex; align-items:center; gap:10px; }
  .mini-range{ display:flex; align-items:center; justify-content:center; gap:12px; }
  .minibtn{
    width:36px; height:36px; border-radius:9px; background:var(--panel);
    border:1px solid var(--line); color:var(--chalk); font-size:19px; line-height:1;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .minibtn:active:not(:disabled){ background:var(--gold); border-color:var(--gold); color:var(--on-gold); }
  .minibtn:disabled{ opacity:0.28; }
  .minival{
    font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600;
    min-width:42px; text-align:center;
  }
  .rangesep{ color:var(--steel); font-size:12px; text-transform:uppercase; letter-spacing:0.06em; }
  .helptext{
    font-size:12.5px; color:var(--steel); line-height:1.5;
    border-top:1px solid var(--line); padding-top:11px;
  }

  /* ---------- Home ---------- */
  .iconbtn{
    width:40px; height:40px; border-radius:10px; background:var(--panel-raised);
    border:1px solid var(--line); color:var(--chalk-dim); font-size:17px;
    display:flex; align-items:center; justify-content:center;
  }

  /* Today's session — the one thing this screen exists to answer */
  .hero{
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:22px 18px;
  }
  .hero.complete{ border-color:var(--patina); }
  .heroname{ font-size:28px; margin:6px 0 4px; line-height:1.05; }
  .herometa{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--steel);
    letter-spacing:0.03em;
  }
  /* Name on its own line, prescription beneath in letterspaced capitals.
     Gold stays off this list entirely — it is spent on the eyebrow and the
     button, and nowhere else on the card. */
  .exlist{ margin:18px 0 20px; }
  .exline{ display:block; padding:13px 0; border-bottom:1px solid var(--hairline); }
  .exline:last-child{ border-bottom:none; }
  .exlname{
    display:block; font-size:15px; font-weight:500; color:var(--chalk);
    margin-bottom:5px; line-height:1.25;
  }
  .exspec{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--steel); font-variant-numeric:tabular-nums;
  }
  .exspec b{ color:var(--chalk); font-weight:500; }
  .exspec .u{ color:var(--steel); font-size:0.88em; }

  /* ---------- Set chart ----------
     The label row, the bar row and the reps row share one gap value, so a weight
     sits dead centre over its own bar. Three separate flex rows with different
     gaps is what makes a chart like this feel subtly wrong. */
  .setchart{ --cgap:8px; margin-top:2px; }
  .setchart .wlabels,
  .setchart .plot{ display:flex; gap:var(--cgap); }
  .setchart .wlabels > *,
  .setchart .plot > .slot{ flex:1; min-width:0; }

  .setchart .wlabels{ margin-bottom:4px; }
  .setchart .wlabels span{
    text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    color:var(--chalk); font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .setchart .wlabels .r{
    font-size:0.78em; vertical-align:super; color:var(--gold-dim); margin-left:1px;
  }
  .setchart .wlabels .under{ color:var(--danger); }
  .setchart .wlabels .warm{ color:var(--steel); }

  .setchart .plot{ position:relative; height:40px; align-items:flex-end; }
  /* On the Progress screen there is room to let it breathe. */
  .bigchart .setchart{ --cgap:10px; }
  .bigchart .setchart .wlabels span{ font-size:13px; }
  .bigchart .setchart .plot{ height:96px; }
  .bigchart .setchart .fl em{ font-size:9px; top:-8px; }
  .setchart .slot{
    position:relative; height:100%; display:flex; align-items:flex-end;
    background:rgba(255,255,255,0.038); border-radius:4px;
  }
  .setchart .b{ width:100%; border-radius:4px 4px 0 0; background:var(--gold); }
  .setchart .b.under{ background:var(--danger); }
  .setchart .b.warm{ background:none; border:1px dashed var(--gold-dim); border-bottom:none; }

  .setchart .fl{
    position:absolute; left:0; right:0; z-index:3;
    border-top:1px dashed var(--gold); pointer-events:none;
  }
  .setchart .fl em{
    position:absolute; right:0; top:-8px; font-style:normal; background:var(--panel);
    padding:0 5px; font-family:'IBM Plex Mono',monospace; font-size:9px;
    letter-spacing:0.11em; text-transform:uppercase; color:var(--gold);
  }

  .setchart .fl em{ font-size:8.5px; top:-7px; }

  /* Set-by-set records, minimal: spacing does the grouping, colour carries the
     floor. No boxes, no chart — the log is scanned, not studied. */
  .setline{
    display:flex; flex-wrap:wrap; gap:5px 18px;
    font-family:'IBM Plex Mono',monospace; font-size:14px;
    font-variant-numeric:tabular-nums; color:var(--chalk);
  }
  .setline .st{ white-space:nowrap; }
  .setline .st .r{
    font-size:0.8em; vertical-align:super; color:var(--gold-dim); margin-left:1.5px;
  }
  .setline .st.under{ color:var(--danger); }
  .setline .st.under .r{ color:var(--danger); opacity:0.8; }
  .setline .st.warm{ color:var(--steel); }
  .setline .st.warm .r{ color:var(--steel); }
  /* rows that open a progress view */
  .exline.tappable{
    width:100%; text-align:left; background:none; color:inherit;
    display:block; -webkit-tap-highlight-color:transparent;
  }
  .exline.tappable:active{ background:var(--panel-raised); }
  /* Log rows carry a chart, so they run tighter than the today card's list. */
  .exline.compact{ padding:10px 0; }
  .exline.compact .exlname{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; margin-bottom:6px; font-size:14px;
  }
  .exline.compact .nm{ min-width:0; }
  .exunit{
    font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--steel); flex-shrink:0;
  }

  .chartwrap{ margin-top:16px; }
  .spark{ width:100%; height:84px; display:block; }
  .chartaxis{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--steel); margin-top:6px;
  }
  .cardmeta.up{ color:var(--patina); }
  .cardmeta.down{ color:var(--danger); }
  .finishcard.pr{ border-color:var(--gold); }

  /* Compact inline form, kept where a stacked row would double the height:
     the wizard's tappable plan rows and the training log. */
  .pr-num{
    font-family:'IBM Plex Mono',monospace; flex-shrink:0; white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .xs-sets{ color:var(--chalk-dim); font-weight:500; }
  .xs-x{ color:var(--steel); padding:0 4px; font-size:0.85em; }
  .xs-reps{ color:var(--chalk); font-weight:500; }
  .planrow.open .xs-sets, .planrow.open .xs-reps{ color:var(--gold); }
  .logbtn-home{
    height:54px; font-family:'Oswald',sans-serif; text-transform:uppercase;
    font-size:17px; letter-spacing:0.07em; font-weight:600;
  }
  .nextup{
    margin-top:14px; padding-top:13px; border-top:1px solid var(--line);
    font-size:13px; color:var(--steel);
  }
  .nextup b{ color:var(--chalk); font-weight:600; }

  .cardhead{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cardmeta{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--chalk-dim); }

  /* Week strip — real dates, so past days show what actually happened */
  .weekstrip{ display:flex; gap:5px; margin-top:14px; }
  .wday{
    flex:1; border-radius:9px; background:var(--panel-raised); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:8px 0 7px;
  }
  .wday .wl{ font-size:9.5px; letter-spacing:0.08em; color:var(--steel); text-transform:uppercase; }
  .wday .wn{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--chalk-dim); }
  .wday.scheduled{ border-color:var(--steel); }
  .wday.scheduled .wn{ color:var(--chalk); }
  .wday.done{ background:var(--patina); border-color:var(--patina); }
  .wday.done .wl, .wday.done .wn{ color:#0d1a0e; }
  .wday.missed{ border-color:var(--danger-dim); }
  .wday.missed .wn{ color:var(--danger); }
  .wday.today{ box-shadow:0 0 0 2px var(--gold); }

  /* Routine summary — a tappable row, not a wall of training theory */
  .routinerow{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; text-align:left; background:var(--panel);
    border:1px solid var(--line); border-radius:var(--radius); padding:15px 18px;
    color:var(--chalk);
  }
  .routinerow .rname{ font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:0.02em; }
  .routinerow .rmeta{ font-size:12px; color:var(--steel); margin-top:3px; }
  .chev-r{ color:var(--steel); font-size:20px; }

  /* ---------- Bottom tab bar ---------- */
  .tabbar{
    position:sticky; bottom:0; z-index:20;
    display:flex; gap:4px; padding:8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    background:var(--bg); border-top:1px solid var(--hairline);
  }
  .tab{
    flex:1; background:none; color:var(--steel);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:7px 0 5px; border-radius:10px;
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em;
  }
  .tab svg{ display:block; }
  .tab.on{ color:var(--gold); }

  /* ---------- Barbell / plate visual ---------- */
  .barbell{
    display:flex; align-items:center; justify-content:center; height:46px; margin:4px 0 2px;
    gap:1px;
  }
  .plate-side{ display:flex; align-items:center; gap:2px; }
  .plate-side.right{ flex-direction:row-reverse; }
  .plate{ border-radius:3px; background:var(--gold); flex-shrink:0; }
  .bar-rod{ width:60px; height:6px; background:var(--steel); border-radius:2px; }
  .loadlabel{ text-align:center; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--steel); margin-bottom:10px; }

  /* ---------- Gym focus mode: one set at a time, no keyboard, no scrolling ---------- */
  .focus-screen{
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    background:var(--bg);
  }
  .focus-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 10px;
  }
  .exit-btn{
    width:44px; height:44px; border-radius:10px; background:var(--panel-raised);
    border:1px solid var(--line); color:var(--steel); font-size:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .focus-progress{
    flex:1; height:5px; border-radius:3px; background:var(--line);
    overflow:hidden; margin:0 14px;
  }
  .focus-progress i{ display:block; height:100%; width:0; background:var(--patina); border-radius:3px; }
  .focus-count{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--steel);
    min-width:44px; text-align:right;
  }

  /* per-set dots for the exercise you're currently on */
  .setdots{ display:flex; gap:7px; justify-content:center; align-items:center; margin-top:11px; }
  .setdots i{ width:9px; height:9px; border-radius:50%; background:var(--line); }
  .setdots i.done{ background:var(--patina); }
  .setdots i.current{ background:var(--gold); width:26px; border-radius:5px; }

  /* ---------- Rest timer ---------- */
  .restband{
    width:100%; max-width:330px; margin:16px 0 4px;
    background:var(--panel); border:1px solid var(--gold-deep);
    border-radius:12px; padding:11px 13px 10px;
  }
  .restband.ready{ border-color:var(--patina); }
  .restrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .restlabel{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--steel);
  }
  .resttime{
    font-family:'IBM Plex Mono',monospace; font-size:27px; font-weight:600;
    color:var(--gold); line-height:1; font-variant-numeric:tabular-nums;
  }
  .restband.ready .resttime{ color:var(--patina); }
  .restacts{ display:flex; gap:6px; }
  .restacts button{
    background:var(--panel-raised); border:1px solid var(--line); color:var(--chalk-dim);
    font-size:11.5px; padding:8px 11px; border-radius:8px;
    text-transform:uppercase; letter-spacing:0.05em;
  }
  .restacts button:active{ background:var(--gold); border-color:var(--gold); color:var(--on-gold); }
  .restbar{ height:4px; background:var(--line); border-radius:2px; margin-top:9px; overflow:hidden; }
  .restbar i{ display:block; height:100%; width:0; background:var(--gold); }
  .restband.ready .restbar i{ background:var(--patina); }

  .focus-body{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:10px 20px 20px; text-align:center; gap:2px;
  }
  .focus-exname{ font-family:'Oswald',sans-serif; font-size:26px; letter-spacing:0.02em; line-height:1.15; }
  .focus-setlabel{
    font-family:'IBM Plex Mono',monospace; color:var(--gold); font-size:13px;
    text-transform:uppercase; letter-spacing:0.1em; margin-top:6px;
  }
  .focus-prev{ font-size:12.5px; color:var(--steel); margin-top:2px; min-height:16px; }
  .focus-target{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--steel);
    margin-top:2px; min-height:14px;
  }

  .stepper-block{ margin-top:20px; }
  .stepper-row{ display:flex; align-items:center; justify-content:center; gap:14px; }
  .stepbtn{
    width:64px; height:64px; border-radius:50%; background:var(--panel-raised);
    border:1px solid var(--line); color:var(--chalk); font-size:28px; line-height:1;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    -webkit-tap-highlight-color:transparent; user-select:none; touch-action:manipulation;
  }
  .stepbtn:active{ background:var(--gold); border-color:var(--gold); color:var(--on-gold); }
  .bignum-wrap{ display:flex; flex-direction:column; align-items:center; width:130px; }
  .bignum{
    font-family:'IBM Plex Mono',monospace; font-size:46px; font-weight:600;
    background:none; border:none; color:var(--chalk); text-align:center;
    width:100%; padding:0; -moz-appearance:textfield; font-variant-numeric:tabular-nums;
  }
  .bignum::-webkit-outer-spin-button, .bignum::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .bignum-unit{
    font-size:11px; color:var(--steel); text-transform:uppercase; letter-spacing:0.1em; margin-top:-2px;
  }
  .stepper-gap{ height:20px; }

  .focus-bb{ margin-top:20px; }

  .focus-actions{
    padding:14px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    display:flex; flex-direction:column; gap:6px;
  }
  .logbtn{
    height:72px; border-radius:14px; font-family:'Oswald',sans-serif; font-size:21px;
    letter-spacing:0.05em; text-transform:uppercase; width:100%;
    background:var(--gold); color:var(--on-gold);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.16);
    touch-action:manipulation;
  }
  .logbtn:active{ background:var(--gold-press); box-shadow:none; }
  .logbtn.done-state{ background:var(--patina); color:#0d1a0e; }
  .focus-links{ display:flex; justify-content:space-between; align-items:center; }
  .focus-links button{
    background:none; color:var(--chalk-dim); font-size:13px; padding:13px 14px;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .focus-links button:disabled{ opacity:0.25; }
  .undo-link{ color:var(--patina) !important; }
  .warm-link.on{ color:var(--gold) !important; }
  /* "End workout" is destructive — keep it off the row your thumb lands on */
  .focus-end{ text-align:center; border-top:1px solid var(--line); margin-top:2px; }
  .focus-end button{
    background:none; color:var(--steel); font-size:11.5px; padding:11px;
    text-transform:uppercase; letter-spacing:0.07em; opacity:0.8;
  }

  .finish-screen{
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px; text-align:center; gap:6px;
  }
  .finish-screen .fi{ font-size:44px; color:var(--patina); margin-bottom:6px; }
  .finish-screen h2{ font-size:24px; }
  .finish-screen p{ color:var(--steel); font-size:14px; max-width:280px; }
  .finish-screen .btn{ margin-top:22px; max-width:280px; }

  /* ---------- In-app confirm modal (native confirm()/alert() are blocked in this sandbox) ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,10,11,0.72);
    display:flex; align-items:center; justify-content:center; padding:24px; z-index:100;
  }
  .modal-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; max-width:340px; width:100%;
  }
  .modal-card p{ font-size:14.5px; line-height:1.5; color:var(--chalk); margin-bottom:18px; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions .btn{ width:auto; flex:1; padding:12px; font-size:14px; }

  /* ---------- Training log / history ---------- */
  .statrow{ display:flex; gap:10px; }
  .statcard{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 8px; text-align:center; }
  .statnum{ font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:600; color:var(--gold); }
  .statlabel{ font-size:10px; color:var(--steel); text-transform:uppercase; letter-spacing:0.04em; margin-top:4px; }

  .heatgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:12px; }
  .heatgrid.heathead{ margin-top:14px; margin-bottom:-4px; }
  .hlabel{
    text-align:center; font-size:9.5px; letter-spacing:0.08em; color:var(--steel);
    text-transform:uppercase;
  }
  .hcell{
    aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:10px; background:var(--panel-raised);
    border:1px solid var(--line); color:var(--steel);
  }
  .hcell.done{ background:var(--patina); border-color:var(--patina); color:#0d1a0e; }
  .hcell.missed{ border-color:var(--danger-dim); color:var(--danger); }
  .hcell.scheduled{ border-color:var(--steel); color:var(--chalk-dim); }
  .hcell.blank{ opacity:0.3; }
  .hcell.future{ opacity:0.55; }
  .hcell.istoday{ box-shadow:0 0 0 2px var(--gold); opacity:1; }

  .heatlegend{ display:flex; gap:14px; margin-top:12px; font-size:11px; color:var(--steel); flex-wrap:wrap; }
  .heatlegend .lg{ display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:middle; }
  .heatlegend .lg.done{ background:var(--patina); }
  .heatlegend .lg.missed{ background:var(--panel-raised); border:1px solid var(--danger-dim); }
  .heatlegend .lg.scheduled{ background:var(--panel-raised); border:1px solid var(--steel); }

  /* Logged sessions use the same shape as the today card: gold eyebrow,
     condensed name, then stacked rows with the spec line beneath each. */
  .logday{ margin-bottom:12px; }
  .logname{ font-size:22px; margin:6px 0 2px; line-height:1.05; }
  .logday .exlist{ margin:14px 0 0; }
  .dayflag{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:9px; }
  .reasontag{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--danger); border:1px solid var(--danger-dim);
    border-radius:20px; padding:3px 9px;
  }
  .reasonnote{ font-size:12.5px; color:var(--chalk-dim); line-height:1.45; }

  /* ---------- Baseline step ---------- */
  .baseline-note{
    background:var(--gold-wash); border:1px solid var(--gold-dim);
    border-radius:10px; padding:11px 13px; margin:14px 0 18px;
    font-size:12.5px; line-height:1.5; color:var(--chalk-dim);
  }
  .baseline-note b{ color:var(--chalk); font-weight:600; }
  .baserow{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:11px 16px; border-bottom:1px solid var(--hairline);
  }
  .baserow:last-child{ border-bottom:none; }
  .basename{ flex:1; min-width:0; font-size:14.5px; line-height:1.3; }
  .basespec{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:10px;
    letter-spacing:0.12em; text-transform:uppercase; color:var(--steel); margin-top:3px;
  }
  .unitrow{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-top:20px; padding-top:16px; border-top:1px solid var(--line);
  }
  .unittoggle{ display:flex; gap:5px; }
  .unittoggle button{
    background:var(--panel-raised); border:1px solid var(--line); color:var(--chalk-dim);
    border-radius:8px; padding:9px 13px; font-size:13px;
  }
  .unittoggle button.on{ background:var(--gold); border-color:var(--gold); color:var(--on-gold); }

  .baseinput{ display:flex; align-items:baseline; gap:6px; flex-shrink:0; }
  .baseinput input{
    width:78px; text-align:right; padding:9px 10px; font-size:15px;
    font-variant-numeric:tabular-nums;
  }
  .baseunit{
    font-family:'IBM Plex Mono',monospace; font-size:11px;
    color:var(--steel); text-transform:uppercase; letter-spacing:0.08em;
  }

  /* ---------- Floor note in the gym ---------- */
  /* ---------- Target card ---------- */
  .targetcard{
    width:100%; max-width:330px; margin:14px 0 2px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; text-align:left;
  }
  .targetcard.rule-progress{ border-color:var(--patina); }
  .targetcard.rule-stall, .targetcard.rule-return, .targetcard.rule-plateau{ border-color:var(--gold-dim); }
  .targetcard.first{ padding:12px 14px; }
  .tgtrow{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:11px 14px 9px;
  }
  .tgtlbl{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--steel);
  }
  .tgtval{
    font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:600;
    color:var(--chalk); font-variant-numeric:tabular-nums;
  }
  .tgtval .tu{ font-size:0.6em; color:var(--steel); margin-left:1px; }
  .tgtval .tx{ color:var(--steel); padding:0 5px; font-size:0.72em; }
  /* the plan for every set of this exercise, at a glance */
  .tgtstrip{
    display:flex; gap:5px; padding:0 14px 11px;
    font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;
  }
  .tsl{
    flex:1; text-align:center; font-size:12.5px; color:var(--chalk-dim);
    background:rgba(255,255,255,0.035); border:1px solid transparent;
    border-radius:7px; padding:4px 0 5px;
  }
  .tsl i{
    display:block; font-style:normal; font-size:8.5px; letter-spacing:0.1em;
    color:var(--steel); margin-bottom:1px;
  }
  .tsl.now{ border-color:var(--gold); color:var(--chalk); background:var(--gold-wash); }
  .tsl.hit{ color:var(--patina); background:rgba(107,156,110,0.1); }
  .tsl.miss{ color:var(--danger); background:rgba(224,85,72,0.1); }
  /* a target the session itself moved — dotted, so a number that changed under
     you never looks like a number you misread */
  .tsl.adj{ border-style:dashed; border-color:var(--gold-dim); }

  /* ---------- Effort ---------- */
  .effortbar{
    width:100%; max-width:330px; margin:12px 0 0;
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:9px 10px 9px 13px;
  }
  .effortbar .eflbl{
    flex:1; min-width:0; font-size:12px; color:var(--chalk-dim);
    text-align:left; line-height:1.3;
  }
  .effortbar.rated .eflbl{ color:var(--steel); }
  /* riding inside the rest band: no card of its own, just a hairline above it */
  .effortbar.inband{
    margin:9px -2px 0; padding:9px 0 0; background:none;
    border:none; border-top:1px solid var(--line); border-radius:0;
  }
  .efbtns{ display:flex; gap:4px; flex-shrink:0; }
  .efbtn{
    background:var(--panel-raised); border:1px solid var(--line); color:var(--chalk-dim);
    border-radius:8px; padding:7px 10px; font-size:12px; line-height:1;
    min-height:32px;
  }
  .efbtn.on{ background:var(--gold); border-color:var(--gold); color:var(--on-gold); }
  .effortbar.rated .efbtn:not(.on){ opacity:0.45; }
  .tgtsub{ color:var(--steel); }
  .tgtev li.ev-set::before{ background:var(--chalk-dim); }

  .tgthead{
    width:100%; display:flex; align-items:center; gap:9px; text-align:left;
    background:rgba(255,255,255,0.028); border:none; border-top:1px solid var(--line);
    padding:10px 14px; color:var(--chalk-dim); font-size:13px;
  }
  .tgticon{
    width:19px; height:19px; flex-shrink:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; background:var(--panel-raised); color:var(--gold);
  }
  .rule-progress .tgticon{ color:var(--patina); }
  .rule-stall .tgticon, .rule-return .tgticon, .rule-plateau .tgticon{ color:var(--danger); }
  .tgttext{ flex:1; min-width:0; color:var(--chalk); }
  .tgtchev{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--gold); flex-shrink:0;
  }
  .tgtwhy{
    padding:11px 14px 13px; font-size:13px; line-height:1.55; color:var(--chalk-dim);
    border-top:1px solid var(--line);
  }
  .targetcard.first .tgtwhy{ border-top:none; padding:0; }
  .tgtev{ list-style:none; margin-top:10px; display:flex; flex-direction:column; gap:5px; }
  .tgtev li{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.04em;
    color:var(--steel); padding-left:13px; position:relative;
  }
  .tgtev li::before{
    content:''; position:absolute; left:0; top:6px;
    width:5px; height:5px; border-radius:50%; background:var(--line);
  }
  .tgtev li.ev-rule::before, .tgtev li.ev-stall::before{ background:var(--gold-dim); }
  .tgtev li.ev-floor::before{ background:var(--gold); }
  .tgtev li.ev-clamp::before, .tgtev li.ev-plateau::before{ background:var(--danger); }
  .tgtev li.ev-trend::before{ background:var(--patina); }
  .tgtev li.ev-effort::before{ background:var(--gold-dim); }
  .tgtev li.ev-conf{ color:var(--chalk-dim); }

  /* ---------- Next session, on the Progress screen ---------- */
  .nextrow{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; margin-top:8px; flex-wrap:wrap;
  }
  .nexthead{ font-size:16px; color:var(--chalk); font-weight:600; }
  .nextval{
    font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--gold);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .nextval em{ font-style:normal; font-size:0.72em; color:var(--steel); margin-left:1px; }
  .conf{
    display:inline-block; margin-top:10px;
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.09em;
    text-transform:uppercase; color:var(--steel);
    border:1px solid var(--line); border-radius:999px; padding:4px 9px;
  }
  .conf-high{ color:var(--patina); border-color:rgba(107,156,110,0.35); }
  .conf-low{ color:var(--gold-dim); border-color:var(--gold-dim); }

  .floornote{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.11em;
    text-transform:uppercase; margin-top:5px; min-height:14px;
  }
  .floornote .under{ color:var(--danger); }
  .floornote .at{ color:var(--gold); }
  .floornote .above{ color:var(--patina); }

  /* ---------- Finish screen cards ---------- */
  .finishcard{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:15px 16px; margin-top:18px; max-width:320px; width:100%; text-align:left;
  }
  .finishcard.under{ border-color:var(--danger-dim); }
  .finishcard.raised{ border-color:var(--patina); }
  .fcbody{ font-size:13.5px; color:var(--chalk-dim); line-height:1.55; margin-top:5px; }
  .fcbody b{ color:var(--chalk); font-weight:600; }
  .fchint{ font-size:12.5px; color:var(--steel); line-height:1.5; margin-top:9px; }
  .reasons{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .reason{
    background:var(--panel-raised); border:1px solid var(--line); color:var(--chalk-dim);
    border-radius:20px; padding:7px 11px; font-size:12px;
  }
  .reason.on{ background:var(--gold); border-color:var(--gold); color:var(--on-gold); }
  .daynote{ margin-top:10px; font-size:13px; font-family:'Inter',sans-serif; }
  .finishcard.stalled{ border-color:var(--gold-dim); }
  .deloadbtn{ margin-top:9px; font-size:13.5px; padding:11px; }
  .deloadbtn.deloaded{ color:var(--patina); border-color:var(--patina); }

  .floorline{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 0 4px; border-top:1px solid var(--line); margin-top:11px;
  }
  .floorval{
    font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--gold);
    margin-left:8px; font-variant-numeric:tabular-nums;
  }
  .floorreset{ color:var(--danger) !important; }


  .pr-badge{
    display:inline-flex; align-items:center; gap:4px; font-size:10px; color:var(--patina);
    font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.09em;
    border:1px solid var(--patina); border-radius:20px; padding:2px 8px;
    margin-left:9px; vertical-align:middle;
  }

  .stickybar{
    position:sticky; bottom:0; background:linear-gradient(to top, var(--bg) 60%, transparent);
    padding:16px 0 4px; margin-top:6px;
  }

  .steps{ display:flex; gap:6px; margin-bottom:18px; }
  .steps .dot{ flex:1; height:3px; border-radius:2px; background:var(--line); }
  .steps .dot.active{ background:var(--gold); }
  .steps .dot.past{ background:var(--patina); }

  .showmore{ margin-top:4px; font-size:13.5px; padding:11px; }
  .backfillzone{ margin-top:22px; text-align:center; }
  .backupzone{
    margin-top:26px; padding-top:20px; border-top:1px solid var(--line); text-align:center;
  }
  .pastbanner{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--on-gold); background:var(--gold);
    border-radius:20px; padding:4px 12px; margin-bottom:12px;
  }
  .focus-end{ display:flex; align-items:center; justify-content:center; gap:2px; }
  .enddot{ color:var(--steel); font-size:11px; }
  .backuphint{
    font-size:12px; color:var(--steel); line-height:1.5;
    max-width:300px; margin:8px auto 12px;
  }
  .backuprow{ display:flex; gap:10px; max-width:300px; margin:0 auto; }
  .backupstat{ font-size:12px; margin-top:10px; min-height:16px; }
  .backupstat.good{ color:var(--patina); }
  .backupstat.bad{ color:var(--danger); }

  /* Set apart from the content above it so it is never a mis-tap. */
  .dangerzone{
    margin-top:26px; padding-top:20px; border-top:1px solid var(--line); text-align:center;
  }
  .dangerhint{
    font-size:12px; color:var(--steel); line-height:1.5; margin-top:10px;
    max-width:300px; margin-left:auto; margin-right:auto;
  }

  /* ---------- Time travel bar (testing only) ---------- */
  .devbar{
    position:fixed; left:0; right:0; bottom:0; z-index:200;
    background:#0E0E10; border-top:1px solid var(--line);
    padding:9px 12px calc(9px + env(safe-area-inset-bottom, 0px));
  }
  .devbar.shifted{ border-top-color:var(--gold); background:#141008; }
  .devrow{
    max-width:520px; margin:0 auto; display:flex; align-items:center;
    justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .devwhen{ display:flex; align-items:baseline; gap:7px; min-width:0; }
  .devlabel{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--steel);
  }
  .devbar.shifted .devlabel{ color:var(--gold); }
  .devdate{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--chalk); }
  .devoff{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--on-gold);
    background:var(--gold); border-radius:4px; padding:1px 6px;
  }
  .devbtns{ display:flex; gap:4px; }
  .devbtns button{
    background:var(--panel-raised); border:1px solid var(--line); color:var(--chalk-dim);
    border-radius:7px; padding:6px 9px; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    min-width:32px;
  }
  .devbtns button:active:not(:disabled){ background:var(--gold); border-color:var(--gold); color:var(--on-gold); }
  .devbtns button:disabled{ opacity:0.3; }
  /* keep the bar from covering the tab bar / log button */
  body:has(.devbar:not(:empty)) .tabbar{ margin-bottom:52px; }
  body:has(.devbar:not(:empty)) .focus-actions{ padding-bottom:64px; }

  .empty{ text-align:center; padding:40px 20px; color:var(--steel); }
  .empty .plateicon{ font-size:32px; margin-bottom:10px; opacity:0.5; }

  .warnbar{
    background:rgba(193,68,58,0.10); border:1px solid var(--danger-dim);
    border-radius:10px; padding:11px 13px; font-size:12.5px;
    line-height:1.45; color:var(--chalk-dim);
  }
  .warnbar b{ color:var(--chalk); font-weight:600; }

  @media (prefers-reduced-motion:no-preference){
    .card, .tpl, .btn{ transition:transform 0.12s ease, background 0.15s ease, border-color 0.15s ease; }
    .btn-primary:active{ transform:scale(0.98); }
    .chev{ transition:transform 0.15s ease, color 0.15s ease; }
    /* The mark wipes in left to right — it reads as the ratchet being climbed
       rather than a logo fading on. Once per session, not on every screen. */
    .logomark.reveal{ animation:markIn .85s cubic-bezier(.22,.9,.3,1) .1s both; }
    @keyframes markIn{
      from{ clip-path:inset(0 100% 0 0); opacity:.35; }
      to  { clip-path:inset(0 0 0 0);    opacity:1; }
    }

    /* bars grow in once, staggered left to right */
    .setchart .b{ transform-origin:bottom; animation:barRise .5s cubic-bezier(.22,.9,.3,1) both; }
    .setchart .slot:nth-child(2) .b{ animation-delay:.02s; }
    .setchart .slot:nth-child(3) .b{ animation-delay:.06s; }
    .setchart .slot:nth-child(4) .b{ animation-delay:.10s; }
    .setchart .slot:nth-child(5) .b{ animation-delay:.14s; }
    .setchart .slot:nth-child(6) .b{ animation-delay:.18s; }
    @keyframes barRise{ from{ transform:scaleY(0); } to{ transform:scaleY(1); } }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================= DATA ============================= */
const DAYS = [
  {k:'mon', label:'M', full:'Monday'},
  {k:'tue', label:'T', full:'Tuesday'},
  {k:'wed', label:'W', full:'Wednesday'},
  {k:'thu', label:'T', full:'Thursday'},
  {k:'fri', label:'F', full:'Friday'},
  {k:'sat', label:'S', full:'Saturday'},
  {k:'sun', label:'S', full:'Sunday'},
];
const DAY_ORDER = DAYS.map(d=>d.k);

/* What you load the weight onto. Drives the plate diagram, the bar weight, and
   whether a "weight" even makes sense. Classified from the name so the templates
   stay readable and custom exercises get a sensible guess too; it is stored on
   the exercise afterwards, so it can be corrected per exercise. */
function equipmentFor(name){
  const n = (name || '').toLowerCase();
  if(/plank|hollow|dead hang/.test(n))                              return 'bodyweight';
  if(/cable|pushdown|face pull|fly|pulldown/.test(n))               return 'cable';
  if(/machine|leg press|leg curl|leg extension|pec deck/.test(n))   return 'machine';
  if(/dumbbell|\bdb\b|lateral raise/.test(n))                       return 'dumbbell';
  if(/pull-?up|chin-?up|dip|push-?up|rollout|sit-?up|crunch/.test(n)) return 'bodyweight';
  if(/barbell|bench press|squat|deadlift|overhead press|row|curl|calf raise|lunge|hip thrust|shrug/.test(n))
                                                                    return 'barbell';
  return 'other';
}
function usesBar(e){ return e && e.equipment === 'barbell'; }
// Bodyweight movements can still be loaded (weighted pull-ups), so they keep a weight field.

function ex(name, sets, repMin, repMax, inc, isTime){
  return {
    name, sets, repMin, repMax,
    inc: inc===undefined ? 2.5 : inc,
    isTime: !!isTime,
    equipment: equipmentFor(name),
  };
}

const TEMPLATES = [
  {
    id:'fullbody', name:'Full Body', freq:3,
    desc:'Whole-body compound lifts each session. Highest per-session efficiency and the best-supported approach for beginners and time-limited lifters.',
    sessions:[
      {id:'fb-a', name:'Full Body A', exercises:[ex('Barbell Back Squat',3,6,8),ex('Bench Press',3,6,8),ex('Barbell Row',3,8,10),ex('Plank',3,30,60,0,true)]},
      {id:'fb-b', name:'Full Body B', exercises:[ex('Deadlift',2,5,6,5),ex('Overhead Press',3,6,8,1.25),ex('Lat Pulldown',3,8,12),ex('Ab Rollout',3,8,12,0)]},
      {id:'fb-c', name:'Full Body C', exercises:[ex('Front Squat',3,6,8),ex('Incline Bench Press',3,8,10),ex('Seated Cable Row',3,8,12),ex('Side Plank',3,30,45,0,true)]},
    ]
  },
  {
    id:'upperlower', name:'Upper / Lower', freq:4,
    desc:'Splits the body into two halves trained twice weekly each — strong balance of frequency and per-muscle volume for intermediate lifters.',
    sessions:[
      {id:'ul-ua', name:'Upper A', exercises:[ex('Bench Press',4,6,8),ex('Barbell Row',4,6,8),ex('Overhead Press',3,8,10,1.25),ex('Barbell Curl',3,8,12,1.25)]},
      {id:'ul-la', name:'Lower A', exercises:[ex('Barbell Back Squat',4,6,8),ex('Romanian Deadlift',3,8,10),ex('Leg Press',3,10,12,5),ex('Standing Calf Raise',4,10,15,2.5)]},
      {id:'ul-ub', name:'Upper B', exercises:[ex('Incline Bench Press',4,8,10),ex('Pull-Up / Lat Pulldown',4,6,10),ex('Dumbbell Shoulder Press',3,8,12,1.25),ex('Triceps Pushdown',3,10,15,1.25)]},
      {id:'ul-lb', name:'Lower B', exercises:[ex('Deadlift',3,4,6,5),ex('Front Squat',3,6,8),ex('Walking Lunge',3,10,12,2.5),ex('Seated Calf Raise',4,10,15,2.5)]},
    ]
  },
  {
    id:'ppl', name:'Push / Pull / Legs', freq:6,
    desc:'Movement-pattern split run twice per week. High weekly volume and frequency — well suited to lifters training five to six days.',
    sessions:[
      {id:'ppl-push', name:'Push', exercises:[ex('Bench Press',4,6,8),ex('Overhead Press',3,8,10,1.25),ex('Incline Dumbbell Press',3,8,12,1.25),ex('Lateral Raise',3,12,15,1),ex('Triceps Pushdown',3,10,15,1.25)]},
      {id:'ppl-pull', name:'Pull', exercises:[ex('Deadlift',3,5,6,5),ex('Barbell Row',4,6,8),ex('Pull-Up / Lat Pulldown',3,6,10),ex('Face Pull',3,12,15,1),ex('Barbell Curl',3,8,12,1.25)]},
      {id:'ppl-legs', name:'Legs', exercises:[ex('Barbell Back Squat',4,6,8),ex('Romanian Deadlift',3,8,10),ex('Leg Press',3,10,12,5),ex('Leg Curl',3,10,12,2.5),ex('Standing Calf Raise',4,10,15,2.5)]},
    ]
  },
  {
    id:'phul', name:'PHUL', freq:4,
    desc:'Power Hypertrophy Upper Lower — alternates heavy low-rep power days with lighter high-rep hypertrophy days across the same muscle groups.',
    sessions:[
      {id:'phul-up', name:'Upper Power', exercises:[ex('Bench Press',4,3,5,2.5),ex('Barbell Row',4,3,5,2.5),ex('Overhead Press',3,5,8,1.25),ex('Weighted Pull-Up',3,5,8,1.25)]},
      {id:'phul-lp', name:'Lower Power', exercises:[ex('Barbell Back Squat',4,3,5,2.5),ex('Deadlift',3,3,5,5),ex('Leg Press',3,8,10,5),ex('Standing Calf Raise',4,6,10,2.5)]},
      {id:'phul-uh', name:'Upper Hypertrophy', exercises:[ex('Incline Bench Press',3,8,12),ex('Seated Cable Row',3,8,12),ex('Dumbbell Shoulder Press',3,10,12,1.25),ex('Barbell Curl',3,10,12,1.25),ex('Triceps Pushdown',3,10,12,1.25)]},
      {id:'phul-lh', name:'Lower Hypertrophy', exercises:[ex('Front Squat',3,8,12),ex('Romanian Deadlift',3,10,12),ex('Walking Lunge',3,10,12,2.5),ex('Leg Curl',3,10,15,2.5),ex('Seated Calf Raise',3,12,15,2.5)]},
    ]
  },
  {
    id:'arnold', name:'Arnold Split', freq:6,
    desc:'Classic bodybuilding split pairing chest and back, then shoulders and arms, then legs — each hit twice weekly for maximum per-muscle volume.',
    sessions:[
      {id:'ar-cb', name:'Chest & Back', exercises:[ex('Bench Press',4,6,10),ex('Barbell Row',4,6,10),ex('Incline Dumbbell Press',3,8,12,1.25),ex('Lat Pulldown',3,8,12),ex('Cable Fly',3,10,15,1.25)]},
      {id:'ar-sa', name:'Shoulders & Arms', exercises:[ex('Overhead Press',4,6,10,1.25),ex('Lateral Raise',3,12,15,1),ex('Barbell Curl',3,8,12,1.25),ex('Triceps Pushdown',3,8,12,1.25),ex('Face Pull',3,12,15,1)]},
      {id:'ar-legs', name:'Legs', exercises:[ex('Barbell Back Squat',4,6,10),ex('Romanian Deadlift',3,8,12),ex('Leg Press',3,10,15,5),ex('Leg Curl',3,10,15,2.5),ex('Standing Calf Raise',4,10,15,2.5)]},
    ]
  },
];

/* ============================= STATE ============================= */
let state = null;
const STORE_KEY = 'auxano-state-v1';

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
// Local date, not UTC — toISOString() would roll the day over at the wrong hour
// and file a late-evening session under tomorrow (or a morning one under yesterday).
function dateKey(d){
  return d.getFullYear() + '-' +
         String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}
/* Every "what day is it" read in the app goes through nowDate(), so a simulated
   offset can move the whole app through time for testing. Offset 0 = real clock. */
function nowDate(){
  const d = new Date();
  const off = state && state.dev ? (state.dev.dayOffset || 0) : 0;
  return off ? addDays(d, off) : d;
}
function todayKey(){ return dateKey(nowDate()); }
function isTimeTravelling(){ return !!(state && state.dev && state.dev.dayOffset); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
// Monday-start week containing `d`
function weekStart(d){ return addDays(d, -DAY_ORDER.indexOf(weekdayKey(d))); }
function weekdayKey(date){ const idx=(date.getDay()+6)%7; return DAY_ORDER[idx]; } // mon=0
function hasLoggedDay(dateKey){
  const d = state.completions[dateKey];
  return !!d && Object.keys(d).some(k=>k!=='_meta');
}

function freshState(){
  // floors: exId -> the working weight this exercise must never drop below.
  // Seeded from your baseline week, then ratcheted upward as you progress.
  // dev.dayOffset: days to shift "today" by, for simulating a training block.
  return {
    setup:null, history:{}, completions:{}, floors:{},
    settings:{ unit:'kg', bar:20 },
    dev:{ dayOffset:0, panel:false },
  };
}

/* ============================= UNITS =============================
   Weights are stored in whatever unit you picked. Switching units converts
   everything already recorded, so history stays meaningful rather than
   silently reinterpreting 100kg as 100lb. */
const UNITS = {
  kg: { label:'kg', bar:20, plates:[25,20,15,10,5,2.5,1.25], steps:[0,0.5,1,1.25,2,2.5,5,10] },
  lb: { label:'lb', bar:45, plates:[45,35,25,10,5,2.5],      steps:[0,1,2.5,5,10,20,25] },
};
function unitKey(){ return (state && state.settings && state.settings.unit) === 'lb' ? 'lb' : 'kg'; }
function unitDef(){ return UNITS[unitKey()]; }
function unitLabel(){ return unitDef().label; }
function barWeight(){
  const b = state && state.settings ? Number(state.settings.bar) : NaN;
  return isFinite(b) && b > 0 ? b : unitDef().bar;
}
const KG_PER_LB = 0.45359237;
// Round to something you can actually load on a bar.
function roundToPlate(v, unit){
  const smallest = unit === 'lb' ? 2.5 : 1.25;
  return Math.round(v / smallest) * smallest;
}
function convertWeight(v, from, to){
  if(from === to || !isFinite(v) || v === 0) return v;
  const raw = from === 'kg' ? v / KG_PER_LB : v * KG_PER_LB;
  return roundToPlate(raw, to);
}

/* ============================= STORAGE ============================= */
/* window.storage exists only inside the artifact sandbox. A plain browser has
   localStorage — which itself throws on write in some private-browsing modes.
   Try each in order, keep whichever works, and fall back to memory so the app
   still runs for the current session rather than failing silently. */
let memoryStore = {};
const STORAGE_BACKENDS = [
  {
    id:'host',
    available: ()=> !!(window.storage && window.storage.get && window.storage.set),
    get: async k => { const r = await window.storage.get(k); return r && r.value != null ? r.value : null; },
    set: async (k,v) => { await window.storage.set(k,v); },
  },
  {
    id:'local',
    available(){
      try{
        if(!window.localStorage) return false;
        window.localStorage.setItem('__auxano_probe__','1');   // Safari private mode throws here
        window.localStorage.removeItem('__auxano_probe__');
        return true;
      }catch(e){ return false; }
    },
    get: async k => window.localStorage.getItem(k),
    set: async (k,v) => { window.localStorage.setItem(k,v); },
  },
  {
    id:'memory',
    available: ()=> true,
    get: async k => (k in memoryStore ? memoryStore[k] : null),
    set: async (k,v) => { memoryStore[k] = v; },
  },
];
let storageBackend = null;
function pickBackend(){
  if(storageBackend) return storageBackend;
  for(const b of STORAGE_BACKENDS){
    try{ if(b.available()){ storageBackend = b; break; } }catch(e){ /* try the next one */ }
  }
  return storageBackend || STORAGE_BACKENDS[STORAGE_BACKENDS.length-1];
}
function storageIsDurable(){ return pickBackend().id !== 'memory'; }

/* A saved blob can be older than the code reading it, or half-written, or point at
   a routine that no longer exists. Normalise it here so a bad payload sends you to
   the wizard instead of white-screening on the first render. */
function normalizeState(raw){
  const s = freshState();
  if(!raw || typeof raw !== 'object') return s;
  if(raw.history && typeof raw.history === 'object') s.history = raw.history;
  if(raw.completions && typeof raw.completions === 'object') s.completions = raw.completions;
  if(raw.dev && typeof raw.dev === 'object'){
    const off = Number(raw.dev.dayOffset);
    s.dev.dayOffset = isFinite(off) ? Math.round(off) : 0;
    s.dev.panel = !!raw.dev.panel;
  }
  if(raw.floors && typeof raw.floors === 'object'){
    // a corrupt floor would silently cap every future suggestion, so only keep real numbers
    Object.keys(raw.floors).forEach(k=>{
      const v = Number(raw.floors[k]);
      if(isFinite(v) && v >= 0) s.floors[k] = v;
    });
  }

  if(raw.settings && typeof raw.settings === 'object'){
    s.settings.unit = raw.settings.unit === 'lb' ? 'lb' : 'kg';
    const b = Number(raw.settings.bar);
    s.settings.bar = isFinite(b) && b >= 0 ? b : UNITS[s.settings.unit].bar;
  }

  s.setup = normalizeSetup(raw.setup);
  return s;
}

/* The plan is stored whole — session ids AND names — rather than looked up from
   TEMPLATES at render time. Editing a template (or using a custom routine) can
   no longer shift the meaning of a plan somebody is already training on.
   Older saves that predate `sessions` are migrated from their template here. */
function normalizeSetup(setup){
  if(!setup || typeof setup !== 'object') return null;
  if(!setup.dayMap || typeof setup.dayMap !== 'object') return null;
  if(!setup.exercises || typeof setup.exercises !== 'object') return null;

  let sessions = Array.isArray(setup.sessions) ? setup.sessions : null;
  if(!sessions){
    const tpl = TEMPLATES.find(t => t.id === setup.templateId);
    if(!tpl) return null;                       // unknown template and no stored sessions
    sessions = tpl.sessions.map(s => ({ id:s.id, name:s.name }));
  }
  sessions = sessions
    .filter(s => s && typeof s.id === 'string' && Array.isArray(setup.exercises[s.id]))
    .map(s => ({ id:s.id, name: String(s.name || s.id) }));
  if(!sessions.length) return null;

  // exercises must carry ids and equipment; older saves have neither
  const exercises = {};
  sessions.forEach(s=>{
    exercises[s.id] = setup.exercises[s.id].map(e=>({
      ...e,
      id: e.id || (s.id + '__' + slug(e.name)),
      equipment: e.equipment || equipmentFor(e.name),
    }));
  });

  // drop day mappings pointing at sessions that no longer exist
  const dayMap = {};
  Object.keys(setup.dayMap).forEach(k=>{
    if(sessions.some(s => s.id === setup.dayMap[k])) dayMap[k] = setup.dayMap[k];
  });

  return {
    templateId: setup.templateId || 'custom',
    routineName: setup.routineName ||
      (TEMPLATES.find(t=>t.id===setup.templateId) || {}).name || 'Custom routine',
    sessions, dayMap, exercises,
  };
}

/* Plan lookups read the stored plan. The TEMPLATES fallback covers a setup that
   was assembled in memory without going through normalizeSetup — it is a safety
   net, not the normal path. */
function planSessions(){
  if(!state.setup) return [];
  if(Array.isArray(state.setup.sessions) && state.setup.sessions.length) return state.setup.sessions;
  const tpl = TEMPLATES.find(t => t.id === state.setup.templateId);
  return tpl ? tpl.sessions.map(s => ({ id:s.id, name:s.name })) : [];
}
function sessionById(id){ return planSessions().find(s => s.id === id) || null; }
function sessionName(id){ const s = sessionById(id); return s ? s.name : 'Workout'; }
function exercisesFor(id){ return (state.setup && state.setup.exercises && state.setup.exercises[id]) || []; }
function routineName(){
  if(!state.setup) return '';
  if(state.setup.routineName) return state.setup.routineName;
  const tpl = TEMPLATES.find(t => t.id === state.setup.templateId);
  return tpl ? tpl.name : 'Custom routine';
}

async function loadState(){
  const b = pickBackend();
  let raw = null;
  try{ raw = await b.get(STORE_KEY); }
  catch(e){ raw = null; }
  let parsed = null;
  if(raw){
    try{ parsed = JSON.parse(raw); }
    catch(e){ parsed = null; }        // corrupt payload — start clean rather than crash
  }
  state = normalizeState(parsed);
}

let saveFailed = false;
async function saveState(){
  const payload = JSON.stringify(state);
  const b = pickBackend();
  try{
    await b.set(STORE_KEY, payload);
    saveFailed = false;
    return true;
  }catch(e){
    // quota exceeded, or the backend went away mid-session — demote and retry once
    // so the current workout is at least not lost while the app is open
    console.error('save failed on ' + b.id, e);
    if(b.id !== 'memory'){
      storageBackend = STORAGE_BACKENDS[STORAGE_BACKENDS.length-1];
      try{ await storageBackend.set(STORE_KEY, payload); }catch(e2){}
    }
    saveFailed = true;
    return false;
  }
}

/* ============================= IN-APP CONFIRM MODAL ============================= */
// Sandboxed artifact frames block window.confirm()/alert() silently — this is a real substitute.
function showConfirm(message, confirmLabel, onYes, opts){
  const danger = !!(opts && opts.danger);
  const returnFocus = document.activeElement;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalMsg">
      <p id="modalMsg">${message}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modalCancel">Cancel</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" id="modalOk">${confirmLabel}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = ()=>{
    document.removeEventListener('keydown', onKey, true);
    overlay.remove();
    if(returnFocus && returnFocus.focus) returnFocus.focus();
  };
  function onKey(e){
    if(e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if(e.key !== 'Tab') return;
    // keep tabbing inside the dialog while it's open
    const f = [...overlay.querySelectorAll('button')];
    if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  document.addEventListener('keydown', onKey, true);

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#modalCancel').addEventListener('click', close);
  overlay.querySelector('#modalOk').addEventListener('click', ()=>{ close(); onYes(); });
  // Cancel takes focus, so a stray Enter never confirms a destructive action.
  overlay.querySelector('#modalCancel').focus();
}

/* ============================= WIZARD TEMP STATE ============================= */
let wizard = { step:1, selectedDays:[], templateId:null, dayMap:{}, exercises:null, openEx:null, baselines:{} };

/* ============================= THE MARK =============================
   A ratchet: three gains, two small give-backs, ending higher than it started.
   Each give-back is smaller than the gain before it, so every low point still
   sits above the previous high — which is exactly what a floor guarantees.
   One path, six points, no curves: sharp at every size, and the same geometry
   drives the header mark, the favicon and the home-screen icon. */
const MARK_PTS = [[10,86],[34,58],[34,68],[58,40],[58,50],[82,22],[82,90],[10,90]];
const MARK_D = 'M' + MARK_PTS.map(p=>p.join(' ')).join(' L') + ' Z';

let markAnimated = false;        // reveal once per session, not on every screen
function brandHTML(label){
  const cls = 'logomark' + (markAnimated ? '' : ' reveal');
  markAnimated = true;
  return `<div class="brand">
      <svg class="${cls}" viewBox="0 0 100 100" width="21" height="21" aria-hidden="true">
        <path d="${MARK_D}" fill="currentColor"/>
      </svg>${label}</div>`;
}

/* Icons are drawn from the same points onto a canvas at boot, so there is no
   binary asset to keep in sync and the app stays a single file. */
function markCanvas(size, opts){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  if(opts.bg){ ctx.fillStyle = opts.bg; ctx.fillRect(0, 0, size, size); }

  // Centre the artwork's real bounding box, not the 100-unit box it sits in.
  const xs = MARK_PTS.map(p=>p[0]), ys = MARK_PTS.map(p=>p[1]);
  const bx = Math.min(...xs), by = Math.min(...ys);
  const bw = Math.max(...xs) - bx, bh = Math.max(...ys) - by;
  const inner = size - opts.pad * 2;
  const s = inner / Math.max(bw, bh);
  const ox = opts.pad + (inner - bw*s)/2 - bx*s;
  const oy = opts.pad + (inner - bh*s)/2 - by*s;

  ctx.fillStyle = opts.fg;
  ctx.beginPath();
  MARK_PTS.forEach(([x,y],i)=>{
    const px = ox + x*s, py = oy + y*s;
    if(i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  });
  ctx.closePath();
  ctx.fill();
  return c;
}

function setLink(rel, href, sizes){
  let el = document.querySelector(`link[rel="${rel}"]`);
  if(!el){ el = document.createElement('link'); el.rel = rel; document.head.appendChild(el); }
  el.href = href;
  if(sizes) el.setAttribute('sizes', sizes);
}

function installIcons(){
  try{
    const gold = '#C9A227', ground = '#0B0B0C';
    setLink('icon', markCanvas(64, { bg:ground, fg:gold, pad:6 }).toDataURL('image/png'), '64x64');
    // iOS applies its own rounded mask, so this is a full-bleed square with the
    // artwork inset rather than something pre-rounded.
    setLink('apple-touch-icon', markCanvas(180, { bg:ground, fg:gold, pad:34 }).toDataURL('image/png'), '180x180');

    const manifest = {

/* ---------- Simulated training history ----------
   Rather than inventing plausible-looking numbers, this walks forward day by
   day and asks the app's own suggestTarget() what to lift, then decides how the
   session went. The result obeys the ratchet because it was produced by it. */
function startingWeight(e){
  const base = { barbell:40, machine:35, cable:20, dumbbell:12, bodyweight:0, other:20 }[e.equipment] || 20;
  const n = e.name.toLowerCase();
  let f = 1;
  if(/deadlift/.test(n)) f = 1.6;
  else if(/squat|leg press/.test(n)) f = 1.3;
  else if(/row|pulldown|pull-?up/.test(n)) f = 1.1;
  else if(/curl|raise|fly|pushdown|face pull/.test(n)) f = 0.55;
  return roundToPlate(base * f, unitKey());
}

function seedDemo(weeks){
  // Deterministic, so the same history appears every time it is seeded.
  let seed = 20260920;
  const rnd = ()=>{ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];

  state.history = {}; state.completions = {}; state.floors = {};
  invalidatePlans();

  const totalDays = weeks * 7;
  // One lighter week near the end — but only for a block long enough to have
  // earned it. Deloading a quarter of the way through a four-week block is not
  // something anyone actually does, and it flattens the whole simulation.
  const deloadWeek = weeks >= 8 ? Math.floor(weeks * 0.7) : -1;
  let sessions = 0, missed = 0, badDays = 0, deloads = 0;

  for(let back = totalDays - 1; back >= 0; back--){
    const d = addDays(nowDate(), -back);
    const dk = dateKey(d);
    const sid = state.setup.dayMap[weekdayKey(d)];
    if(!sid) continue;

    const week = Math.floor((totalDays - 1 - back) / 7);
    if(rnd() < 0.08){ missed++; continue; }          // life happens

    const isDeload = week === deloadWeek;
    const roll = rnd();
    const badDay = !isDeload && roll < 0.06;
    if(isDeload) deloads++;
    if(badDay) badDays++;

    const entry = { _meta:{ sessionId:sid, sessionName:sessionName(sid), note:'', reason:'', prs:[] } };
    const prs = [];

    exercisesFor(sid).forEach(exSpec=>{
      const target = suggestTarget(exSpec, dk);
      let weight = target.weight;
      if(weight === null || weight === undefined) weight = startingWeight(exSpec);

      const floorBefore = floorFor(exSpec.id);
      if(isDeload) weight = roundToPlate(weight * 0.9, unitKey());
      if(badDay)   weight = roundToPlate(weight * 0.85, unitKey());

      // how the sets actually went
      const r = rnd();
      const sets = [];
      if(!exSpec.isTime && exSpec.equipment === 'barbell' && weight > 0){
        sets.push({ weight: roundToPlate(weight * 0.5, unitKey()), reps: exSpec.repMin, warmup:true });
      }
      for(let i = 0; i < exSpec.sets; i++){
        let reps;
        // Roughly 45% of sessions clear the top of the range, which is what a
        // real double-progression block looks like — at 14% the squat only
        // gained 5kg across three months, which is not a believable block.
        if(isDeload)      reps = exSpec.repMin;
        else if(r < 0.45) reps = exSpec.repMax;                                   // everything clicked
        else if(r < 0.78) reps = i === exSpec.sets - 1 ? exSpec.repMax - 1 : exSpec.repMax;
        else if(r < 0.92) reps = Math.max(exSpec.repMin, exSpec.repMax - 2);
        else              reps = Math.max(1, exSpec.repMin - 1);                  // stalled
        /* Effort, the way it actually gets logged: sets get harder as the
           exercise goes on, a deload feels easy throughout, and about one set
           in eight goes unrated because you forgot. */
        let effort;
        if(rnd() < 0.12)       effort = null;
        else if(isDeload)      effort = 'easy';
        else if(i === 0)       effort = rnd() < 0.5 ? 'easy' : 'ok';
        else if(i >= exSpec.sets - 1) effort = rnd() < 0.65 ? 'hard' : 'ok';
        else                   effort = rnd() < 0.7 ? 'ok' : 'hard';
        sets.push({ weight, reps, ...(effort ? { effort } : {}) });
      }

      const working = sets.filter(s=>!s.warmup);
      if(!exSpec.isTime && isPR(exSpec.id, working, dk)) prs.push(exSpec.id);

      if(!state.history[exSpec.id]) state.history[exSpec.id] = [];
      state.history[exSpec.id].push({ date: dk, sets });
      if(working.length) raiseFloor(exSpec, working);

      entry[exSpec.id] = {
        name: exSpec.name, isTime: exSpec.isTime, sets,
        ...(floorBefore > 0 ? { floor: floorBefore } : {}),
      };
    });

    entry._meta.prs = prs;
    if(badDay){
      entry._meta.reason = pick(BAD_DAY_REASONS.filter(x=>x!=='Deload'));
      entry._meta.note = pick(['felt flat all session','slept badly','short on time','back was tight']);
    } else if(isDeload){
      entry._meta.reason = 'Deload';
      entry._meta.note = 'planned lighter week';
    }
    state.completions[dk] = entry;
    sessions++;
  }
  return { sessions, missed, badDays, deloads, weeks };
}

  const off = state.dev.dayOffset || 0;

  devBar.className = 'devbar' + (off ? ' shifted' : '');
  devBar.innerHTML = `
    <div class="devrow">
      <div class="devwhen">

        <span class="devdate">${d.toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'})}</span>

      </div>
      <div class="devbtns">

    btn.addEventListener('click', ()=>{
      if(!state.setup) return;
      const weeks = parseInt(btn.dataset.seed, 10);
      const span = weeks >= 12 ? 'three months' : weeks >= 8 ? 'two months' : 'a month';
      showConfirm(
        `Replace your history with ${span} of simulated training?<br><br>` +
        `Sessions are generated by running the app's own progression forward day by day, ` +
        `so the floors and targets are genuinely earned. <b>Your current log and floors are erased.</b>`,
        'Simulate',
        async ()=>{

          backupStat(`Simulated ${r.weeks} weeks — ${r.sessions} sessions, ` +

function newCustomSession(i){

// Exercise ids must stay unique inside a session, even with repeated names.
function makeExId(sessionId, name, taken){
  const base = sessionId + '__' + slug(name);
  let id = base, n = 2;
  while(taken.indexOf(id) > -1){ id = base + '-' + n; n++; }
  return id;
}
function defaultExercise(sessionId, name, taken){
  const eq = equipmentFor(name);
  const inc = eq === 'barbell' ? (unitKey()==='lb' ? 5 : 2.5)
            : eq === 'machine' ? (unitKey()==='lb' ? 10 : 5)
            : (unitKey()==='lb' ? 2.5 : 1.25);
  return { name, sets:3, repMin:8, repMax:12, inc, isTime:false,
           equipment:eq, id: makeExId(sessionId, name, taken) };
}

/* Switching units rewrites every stored weight, so 100kg becomes 220lb rather
   than silently being re-read as 100lb. */
async function setUnit(next){
  const from = unitKey();
  if(next === from) return;
  const conv = v => convertWeight(v, from, next);

  Object.keys(state.floors).forEach(k=>{ state.floors[k] = conv(state.floors[k]); });
  Object.keys(state.history).forEach(k=>{
    state.history[k].forEach(h=> h.sets.forEach(s=>{ s.weight = conv(s.weight); }));
  });
  Object.keys(state.completions).forEach(dk=>{
    const entry = state.completions[dk];
    Object.keys(entry).forEach(k=>{
      if(k === '_meta' || !entry[k].sets) return;
      entry[k].sets.forEach(s=>{ s.weight = conv(s.weight); });
    });
  });
  const stepUp = (list, v) => list.reduce((b,x)=> Math.abs(x-v) < Math.abs(b-v) ? x : b, list[0]);
  if(state.setup){
    Object.keys(state.setup.exercises).forEach(sid=>{
      state.setup.exercises[sid].forEach(e=>{
        if(e.inc) e.inc = stepUp(UNITS[next].steps, conv(e.inc));
      });
    });
  }
  if(wizard && wizard.exercises){
    Object.keys(wizard.exercises).forEach(sid=>{
      wizard.exercises[sid].forEach(e=>{
        if(e.inc) e.inc = stepUp(UNITS[next].steps, conv(e.inc));
      });
    });
  }
  if(wizard && wizard.baselines){
    Object.keys(wizard.baselines).forEach(k=>{ wizard.baselines[k] = conv(wizard.baselines[k]); });
  }

  invalidatePlans();
  state.settings.unit = next;
  state.settings.bar = UNITS[next].bar;
  await saveState();
}

/* Weight jumps are picked from a list of real plate increments rather than typed —
   0.25-by-0.25 spinners produce loads nobody can actually put on a bar. */
function weightSteps(){ return unitDef().steps; }

function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }

/* The plan rows are shared by the first-run wizard and the Plan page. Both keep
   an editable draft with the same shape, so the row code works against whichever
   one is active rather than being duplicated. */
function editCtx(){ return planDraft || wizard; }
function editRepaint(){ if(planDraft) renderPlan(); else renderWizard(); }
function editFloor(exId){
  const d = editCtx();
  if(d && d.floors && d.floors[exId] > 0) return d.floors[exId];
  return planDraft ? 0 : floorFor(exId);

function repRange(e){
  const range = e.repMin===e.repMax ? `${e.repMin}` : `${e.repMin}–${e.repMax}`;
  return range + (e.isTime ? 's' : '');
}
function exSummary(e){ return `${e.sets} × ${repRange(e)}`; }
// Same text, but with each part addressable so the numbers can carry the emphasis.
function exSummaryHTML(e){
  return `<span class="xs-sets">${e.sets}</span><span class="xs-x">×</span><span class="xs-reps">${repRange(e)}</span>`;
}
/* The today card is a prescription, not a record, so the rep range stays a range
   — that IS the target. But it names the exact weight to load, so you never have
   to work it out at the rack. */
function exSpecCaps(e){
  const base = `<b>${e.sets}</b> Sets &nbsp;·&nbsp; <b>${repRange(e)}</b> ${e.isTime ? 'Hold' : 'Reps'}`;
  if(e.isTime) return base;
  const t = suggestTarget(e);
  if(t.weight === null || t.weight === undefined) return base;
  return `${base} &nbsp;·&nbsp; <b>${num(t.weight)}</b><span class="u">${unitLabel()}</span>`;
}

/* ---------- The set chart ----------
   Every set as a flat bar seated in its own slot, with the floor drawn across at
   its true height on a 0-to-max axis. Weights sit above the plot and reps below —
   never inside the bars, where they were unreadable. The three rows share one gap
   so each label is centred over its own bar.

   Returns null when a chart would be meaningless (nothing has a weight), and the
   caller falls back to plain text. */
function setChartHTML(e){
  const sets = (e && e.sets) || [];
  if(!sets.length) return null;
  const isTime = !!e.isTime;
  const valueOf = s => isTime ? (+s.reps || 0) : (+s.weight || 0);
  const vals = sets.map(valueOf);
  if(!vals.some(v => v > 0)) return null;        // bodyweight only: no axis worth drawing

  // Only a recorded floor is trustworthy for a past session.
  const floor = (!isTime && e.floor > 0) ? e.floor : 0;
  const top = Math.max(floor, ...vals) * 1.12;
  const pct = v => (v / top) * 100;

  // Weight and reps share one line above each bar. Three stacked rows per
  // exercise made a single session scroll for pages.
  const labels = sets.map((s,i)=>{
    const v = vals[i];
    const cls = s.warmup ? 'warm' : (floor > 0 && v < floor ? 'under' : '');
    const tail = isTime ? 's' : `<span class="r">${s.reps}</span>`;
    return `<span class="${cls}">${num(v)}${tail}</span>`;
  }).join('');

  const bars = sets.map((s,i)=>{
    const v = vals[i];
    const cls = s.warmup ? 'warm' : (floor > 0 && v < floor ? 'under' : '');
    return `<div class="slot"><div class="b ${cls}" style="height:${pct(v).toFixed(1)}%"></div></div>`;
  }).join('');

  const floorLine = floor > 0
    ? `<div class="fl" style="bottom:${pct(floor).toFixed(1)}%"><em>floor ${num(floor)}</em></div>`
    : '';

  return `
    <div class="setchart">
      <div class="wlabels">${labels}</div>
      <div class="plot">${floorLine}${bars}</div>
    </div>`;
}

/* One line, every set exactly, nothing else: "120×10  125×9  115×11".
   The log is for scanning — colour carries the floor, spacing does the grouping,
   and the unit is stated once on the row above. */
function loggedSpecCaps(e){
  const sets = e.sets || [];
  if(!sets.length) return '';
  const sfx = e.isTime ? 's' : '';
  const floor = (!e.isTime && e.floor > 0) ? e.floor : 0;
  return sets.map(s=>{
    const w = +s.weight || 0;
    const cls = s.warmup ? 'warm' : (floor > 0 && w < floor ? 'under' : '');
    // Reps ride raised on the weight, like a footnote — the weight is the number
    // you're actually reading, so it keeps full size and nothing competes with it.
    const body = w > 0 ? `${num(w)}<span class="r">${s.reps}${sfx}</span>` : `${s.reps}${sfx}`;
    return `<span class="st ${cls}"${s.warmup ? ' title="Warm-up set"' : ''}>${body}</span>`;
  }).join('');
}
